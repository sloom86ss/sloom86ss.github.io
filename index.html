function renderMatches(){
let list=current==='all'?matches:matches.filter(m=>m.key===current);

html+=`<div class="card"><div class="hd"><span>${lg}</span><span class="bb">✅ مضمون 100% - سلوم تيفي</span></div>`;

}

}
