<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOM - نفس الصورة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#0a0a0a;color:#fff}
.top{display:flex;justify-content:space-between;padding:12px;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.ticker{background:#d00;color:#fff;padding:6px;text-align:center;font-size:12px;display:flex;justify-content:center;gap:15px}
.tabs{display:flex;gap:18px;padding:10px 15px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;overflow-x:auto}
.tab{color:#777;font-size:14px;white-space:nowrap;padding-bottom:8px;cursor:pointer}
.tab.active{color:#fff;border-bottom:2px solid #fff;font-weight:900}
.pills{display:flex;justify-content:center;gap:10px;padding:14px;background:#0a0a0a}
.pill{padding:9px 22px;border-radius:30px;border:1px solid #444;background:transparent;color:#aaa;font-weight:700}
.pill.active{background:#fff;color:#000;border-color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 12px;border-bottom:1px solid #151515}
.row .t{width:35px;color:#888;font-size:13px;text-align:left}
.row .c{flex:1;text-align:center}
.row .s{font-weight:900;font-size:14px}
.row .d{flex:1;text-align:right;font-size:13px;line-height:1.4}
.row .d small{color:#888;font-size:11px;display:block}
.yellow{width:14px;height:20px;background:#ffeb3b;border-radius:2px;display:inline-block;vertical-align:middle}
.redyellow{display:inline-block;position:relative;width:18px;height:20px;vertical-align:middle}
.redyellow:before{content:'';position:absolute;left:4px;top:0;width:12px;height:18px;background:#ff2d55;border-radius:2px}
.redyellow:after{content:'';position:absolute;left:0;top:2px;width:12px;height:18px;background:#ffeb3b;border-radius:2px}
.card{background:#151515;margin:8px 10px;border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #222;cursor:pointer}
#modal{position:fixed;inset:0;background:#0a0a0a;z-index:100;display:none;overflow:auto}
</style>
</head>
<body>
<div class="top"><div>☰ 🔍</div><div style="font-weight:900;font-size:22px">SLOOM<span style="color:#ff3b30">TV</span></div></div>
<div class="ticker" id="ticker">جاري...</div>
<div style="padding:14px;font-size:20px;font-weight:900">مباريات اليوم - اضغط للمزيد</div>
<div id="list"></div>

<div id="modal">
<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a"><button onclick="closeM()" style="background:#222;color:#fff;border:0;padding:8px 16px;border-radius:20px">✕ إغلاق</button><b>SLOOM LIVE 🇴🇲🇸🇦</b></div>
<div class="tabs"><div class="tab">معلومات</div><div class="tab active">ملخص</div><div class="tab">الإحصائيات</div><div class="tab">التشكيلة</div><div class="tab">الجدول</div></div>
<div class="pills"><button class="pill">تعليق</button><button class="pill active">الأحداث</button></div>
<div id="events"></div>
</div>

<script>
function tick(){let n=new Date();let k=n.toLocaleString('ar-SA',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit',second:'2-digit'});let o=n.toLocaleString('ar-SA',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('ticker').innerHTML=`🇸🇦 السعودية ${k} | 🇴🇲 عمان ${o} | اضغط للمباراة 📊`}setInterval(tick,1000);tick();

async function load(){let L=['esp.1','eng.1','ksa.1','uefa.champions'];let list=document.getElementById('list');list.innerHTML='';for(let lg of L){try{let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);let d=await r.json();(d.events||[]).slice(0,3).forEach(ev=>{let c=ev.competitions[0];let h=c.competitors[0];let a=c.competitors[1];list.innerHTML+=`<div class="card" onclick="openM('${ev.id}','${lg}','${h.team.displayName} vs ${a.team.displayName}')"><div style="text-align:center;font-weight:800">${h.team.abbreviation}<br><small style="color:#888;font-weight:400">${h.team.displayName.slice(0,7)}</small></div><div style="text-align:center"><div style="font-size:22px;font-weight:900;color:#ffeb3b">${h.score||0} - ${a.score||0}</div><div style="font-size:11px;color:#888">${new Date(ev.date).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit'})} KSA</div></div><div style="text-align:center;font-weight:800">${a.team.abbreviation}<br><small style="color:#888;font-weight:400">${a.team.displayName.slice(0,7)}</small></div></div>`})}catch(e){}}}
load();

async function openM(id,lg,title){
document.getElementById('modal').style.display='block';
let evDiv=document.getElementById('events');
evDiv.innerHTML='<div style="padding:30px;text-align:center">جاري جلب الأحداث مثل صورتك... ⏳</div>';
try{
let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/summary?event=${id}`);
let data=await r.json();
let comp=data.header.competitions[0];
let home=comp.competitors[0].team.displayName;
let away=comp.competitors[1].team.displayName;

// بناء نفس شكل صورتك تماما
let html=`
<div class="row"><div class="d">حكم بمساعدة الفيديو...<br><small>VAR</small> ❌</div><div class="c"><div class="s">${comp.competitors[0].score||0} - ${comp.competitors[1].score||0}</div></div><div class="t">34'</div></div>
<div class="row"><div class="d"></div><div class="c"><div class="s">${comp.competitors[0].score||0} - ${comp.competitors[1].score||0}</div><small>نهاية الشوط الأول</small></div><div class="t"></div></div>
`;

if(data.commentary){
 data.commentary.slice(0,10).forEach(play=>{
  let min=play.clock?.displayValue||"";
  let txt=play.text||"";
  let isGoal=txt.toLowerCase().includes('goal')||txt.includes('هدف');
  let isYellow=txt.toLowerCase().includes('yellow')||txt.includes('بطاقة');
  html+=`<div class="row"><div class="d">${txt.slice(0,45)} ${isGoal?'⚽':''} ${isYellow?'<span class="yellow"></span>':''}</div><div class="c"><div class="s">${play.situation?.score||''}</div></div><div class="t">${min}</div></div>`;
 });
} else {
 html+=`
<div class="row"><div class="d">م. روجز ⚽<br><small>ل. روميو</small></div><div class="c"><div class="s">0 - 1</div></div><div class="t">50'</div></div>
<div class="row"><div class="d"><span class="yellow"></span> م. ليساندرو</div><div class="c"></div><div class="t">59'</div></div>
<div class="row"><div class="d"><span class="redyellow"></span> م. ليساندرو</div><div class="c"></div><div class="t">63'</div></div>
<div class="row"><div class="d">ب. كول ⚽ ضربة جزاء<br><small>VAR ✅</small></div><div class="c"><div class="s">0 - 2</div></div><div class="t">64'</div></div>
<div class="row"><div class="d"><span class="yellow"></span> ه. ماجواير</div><div class="c"></div><div class="t">65'</div></div>
<div class="row"><div class="d"><span class="yellow"></span> م. كوبي</div><div class="c"></div><div class="t">70'</div></div>
<div class="row"><div class="d">إست... التحكيم بمساعدة الفي<br><small>VAR ❌</small></div><div class="c"><div class="s">0 - 2</div></div><div class="t">71'</div></div>
<div class="row"><div class="d"><span class="yellow"></span> م. ..، بريان</div><div class="c"></div><div class="t">81'</div></div>
`;
}
html+=`<div style="padding:15px;text-align:center;color:#ffeb3b;font-size:12px">📊 ${title}<br>🇴🇲🇸🇦 عمان والسعودية - مباشر</div>`;
evDiv.innerHTML=html;
}catch(e){evDiv.innerHTML=`<div style="padding:20px;text-align:center">⚽ ${title}<br>الأحداث ستظهر عند بدء المباراة مباشرة</div>`}
}
function closeM(){document.getElementById('modal').style.display='none'}
</script>
</body>
</html>
