<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="1to1lmgptPdQBO6SsdgpAv8meSroswl34D89V78Xvnk" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOMTV - ChatGPT حقيقي بدون مفتاح</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#080810;color:#fff}
.h{background:linear-gradient(135deg,#14142a,#1e1e4a);padding:20px;text-align:center;border-bottom:3px solid #ff0040}
.logo{font-size:42px;font-weight:900}.logo span{color:#ffeb3b}
.badge{background:#0f2815;border:1px solid #22c55e;color:#22c55e;padding:6px 16px;border-radius:30px;display:inline-block;font-size:12px;margin-top:10px;font-weight:800}
.ticker{background:#ff0040;color:#fff;padding:8px;text-align:center;font-size:13px;font-weight:700}
.container{max-width:750px;margin:0 auto;padding:15px}
.card{background:#12122a;border:1px solid #222;border-radius:16px;padding:18px;margin-bottom:15px}
.match-head{display:flex;justify-content:space-between;align-items:center}
.team{font-weight:800;font-size:16px;width:90px;text-align:center}
.score{font-size:32px;font-weight:900;color:#ffeb3b;text-align:center}
.status{font-size:11px;color:#22c55e;font-weight:700;text-align:center;margin-top:4px}
.league{font-size:11px;color:#888;margin-bottom:10px;text-align:center}
#ai-btn{position:fixed;bottom:20px;left:20px;background:#ffeb3b;color:#000;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(255,235,59,0.5);z-index:9999}
#ai-chat{position:fixed;bottom:90px;left:20px;width:360px;max-width:93vw;height:480px;background:#12122a;border:1px solid #333;border-radius:18px;display:none;flex-direction:column;z-index:9999;overflow:hidden}
#ai-header{background:linear-gradient(90deg,#ff0040,#ff6b6b);padding:12px;text-align:center;font-weight:900;font-size:14px;display:flex;justify-content:space-between}
#ai-messages{flex:1;padding:12px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:6px}
#ai-input{display:flex;border-top:1px solid #222;background:#080810}
#ai-input input{flex:1;background:transparent;border:0;color:white;padding:13px;outline:none}
#ai-input button{background:#ffeb3b;border:0;padding:0 18px;font-weight:900;cursor:pointer}
.msg-user{background:#ffeb3b;color:#000;padding:9px 12px;border-radius:14px 14px 2px 14px;align-self:flex-end;max-width:85%}
.msg-ai{background:#1e1e3a;padding:9px 12px;border-radius:14px 14px 14px 2px;align-self:flex-start;max-width:88%;color:#ddd;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<div class="h"><div class="logo">SLOOM<span>TV</span></div><div class="badge">● LIVE + AI حقيقي بدون مفتاح</div></div>
<div class="ticker">⚽ نتائج تلقائية + ذكاء اصطناعي حقيقي مجاني 💬</div>
<div class="container" id="matches"><div style="text-align:center;padding:40px;color:#888">جاري جلب المباريات... ⏳</div></div>

<div id="ai-btn" onclick="toggleAI()">🤖</div>
<div id="ai-chat">
<div id="ai-header"><span>🤖 SLOOM GPT</span><span style="cursor:pointer" onclick="toggleAI()">✕</span></div>
<div id="ai-messages"><div class="msg-ai">أهلاً! أنا SLOOM GPT الحقيقي 🧠

بدون مفتاح ولا تسجيل - اسألني أي شي:
• نتيجة مباراة؟
• تحليل؟
• واجب، برمجة، قصة؟
• أي سؤال في الحياة!

جرب الحين 👇</div></div>
<div id="ai-input"><input id="ai-q" placeholder="اسأل أي شي..." onkeypress="if(event.key==='Enter')askAI()"><button onclick="askAI()">➤</button></div>
</div>

<script>
async function loadMatches(){
  try{
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard`);
    const data = await res.json();
    let events = data.events || [];
    const container=document.getElementById('matches'); container.innerHTML='';
    if(events.length===0) container.innerHTML=`<div class="card"><div class="match-head"><div class="team">لوهافر</div><div style="text-align:center"><div class="score">1 - 5</div><div class="status">انتهت</div></div><div class="team">باريس</div></div></div>`;
    events.slice(0,8).forEach(ev=>{
      const comp=ev.competitions[0]; const home=comp.competitors[0]; const away=comp.competitors[1];
      container.innerHTML+=`<div class="card"><div class="match-head"><div class="team">${home.team.abbreviation}</div><div style="text-align:center"><div class="score">${home.score||0} - ${away.score||0}</div><div class="status">${comp.status.type.description}</div></div><div class="team">${away.team.abbreviation}</div></div></div>`;
    });
  }catch(e){}
}
loadMatches(); setInterval(loadMatches,60000);
function toggleAI(){let c=document.getElementById('ai-chat'); c.style.display=c.style.display==='flex'?'none':'flex';}

async function askAI(){
  let q=document.getElementById('ai-q'); if(!q.value.trim())return;
  let m=document.getElementById('ai-messages'); let question=q.value;
  m.innerHTML+=`<div class="msg-user">${question}</div>`; q.value='';
  m.innerHTML+=`<div class="msg-ai" id="typing">يكتب... ⏳</div>`; m.scrollTop=m.scrollHeight;
  try{
    // API مجاني 100% بدون مفتاح
    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(`أنت مساعد ذكي عربي اسمه SLOOM AI في موقع رياضي SLOOMTV. جاوب باختصار وود بالعربية. السؤال: ${question}`)}`);
    const text = await res.text();
    document.getElementById('typing').remove();
    m.innerHTML+=`<div class="msg-ai">${text}</div>`;
  }catch(err){
    document.getElementById('typing')?.remove();
    m.innerHTML+=`<div class="msg-ai">جرب مرة ثانية، الاتصال بطيء شوي. اسألني: نتيجة باريس؟ أو أي شي!</div>`;
  }
  m.scrollTop=m.scrollHeight;
}
</script>
</body>
</html>
