<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوم تيفي - مثل 365</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif;margin:0}
body{background:#121212;color:#fff}
.header365{background:#1f1f1f;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00d084;position:sticky;top:0;z-index:20}
.logo365{background:linear-gradient(135deg,#6a2db8,#00d084);color:#fff;padding:8px 18px;border-radius:10px;font-weight:900;font-size:18px;letter-spacing:1px}
.liveTop{background:#00d084;color:#000;padding:5px 12px;border-radius:20px;font-weight:900;font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.time365{background:#1f1f1f;padding:10px;display:flex;justify-content:space-around;font-size:12px;font-weight:700;color:#aaa;border-bottom:1px solid #2a2a2a}
.time365 bdi{color:#fff}
.wrap365{padding:10px}
.title365{background:#1f1f1f;color:#00d084;padding:12px;text-align:center;border-radius:10px;font-weight:900;border:1px solid #2a2a2a;margin-bottom:10px}
.tabs365{display:flex;gap:6px;margin-bottom:10px}
.tab365{flex:1;padding:12px;background:#2a2a2a;border:none;color:#aaa;border-radius:10px;font-weight:900;font-size:13px}
.tab365.active{background:#00d084;color:#000}
.chips365{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin-bottom:10px}
.chip365{padding:7px 14px;background:#2a2a2a;color:#fff;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0;border:1px solid #333}
.chip365.active{background:#6a2db8;border-color:#6a2db8}
.leagueHeader{background:#1f1f1f;color:#00d084;padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:900;border:1px solid #2a2a2a;border-bottom:none;display:flex;justify-content:space-between}
.card365{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:0 0 10px 10px;margin-bottom:12px;overflow:hidden}
.row365{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border-bottom:1px solid #2a2a2a}
.row365:last-child{border:none}
.team365{display:flex;align-items:center;gap:8px;width:38%;font-weight:700;font-size:14px}
.team365.right{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.logo365img{width:32px;height:32px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}
.score365{width:24%;text-align:center}
.num365{font-size:22px;font-weight:900;color:#fff;direction:ltr}
.minute365{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:900;margin-top:4px;display:inline-block}
.live365{background:#ff1744;color:#fff;animation:blink 1s infinite}
.ft365{background:#00d084;color:#000}
.soon365{background:#333;color:#aaa}
@keyframes blink{50%{opacity:.5}}
.sloom365{text-align:center;padding:8px;background:#161616;color:#6a2db8;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="header365">
<div class="logo365">سلوم تيفي</div>
<div style="display:flex;gap:8px;align-items:center"><button onclick="toggleLang()" id="lb" style="background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:20px;padding:6px 12px;font-size:11px">EN / عربي</button><div class="liveTop">● LIVE</div></div>
</div>
<div class="time365"><div>🇴🇲 مسقط <bdi id="oma">--:--:--</bdi></div><div>🇸🇦 الرياض <bdi id="ksa">--:--:--</bdi></div><div>365 STYLE</div></div>
<div class="wrap365">
<div class="title365" id="tt">مباريات اليوم - LIVE</div>
<div class="tabs365"><button class="tab365" id="tabAms" onclick="show('ams')">الأمس</button><button class="tab365 active" id="tabToday" onclick="show('today')">اليوم LIVE</button><button class="tab365" id="tabGhad" onclick="show('ghad')">الغد</button></div>
<div class="chips365" id="lbar"></div>
<div id="list">بوت 365 السريع يجمع...</div>
</div>

<script>
let cur='today',curL='all',lang='ar';
const leagues=[
{id:'all',n:'الكل',en:'All'},
{id:'sau.1',n:'روشن 🇸🇦',en:'Roshn'},
{id:'eng.1',n:'الإنجليزي',en:'Premier'},
{id:'esp.1',n:'الإسباني',en:'LaLiga'},
{id:'ita.1',n:'الإيطالي',en:'Serie A'},
{id:'ger.1',n:'الألماني',en:'Bundes'},
{id:'fra.1',n:'الفرنسي',en:'Ligue1'},
{id:'uefa.champions',n:'الأبطال',en:'UCL'}
];
const logos={
'MAN':'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg',
'CHE':'https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg',
'BOU':'https://upload.wikimedia.org/wikipedia/en/e/e5/AFC_Bournemouth_%282013%29.svg',
'MCI':'https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg',
'ARS':'https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg',
'HIL':'https://upload.wikimedia.org/wikipedia/en/a/a7/Al_Hilal_SFC_logo.svg',
'ITT':'https://upload.wikimedia.org/wikipedia/commons/7/7d/Al-Ittihad_logo.svg',
'NAS':'https://upload.wikimedia.org/wikipedia/commons/4/43/Al-Nassr_logo.svg',
'FCB':'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',
'RMA':'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg'
};
const nameAR={
"Al Hilal":"الهلال","Al Ittihad":"الاتحاد","Al Nassr":"النصر","Manchester United":"مانشستر يونايتد","Chelsea":"تشيلسي","Bournemouth":"بورنموث","Manchester City":"مانشستر سيتي","Arsenal":"أرسنال","Leeds United":"ليدز","Barcelona":"برشلونة","Real Madrid":"ريال مدريد"
};

let store={today:[],ams:[],ghad:[]};
function dateStr(o=0){let d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10).replace(/-/g,'');}
function dateShow(o=0){let d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10);}

async function bot365(league,date){
try{
let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${date}`);
let j=await r.json();
if(!j.events) return [];
return j.events.map(ev=>{
let c=ev.competitions[0]; let h=c.competitors.find(x=>x.homeAway==='home'); let a=c.competitors.find(x=>x.homeAway==='away');
let state=c.status.type.state;
let minute= state==='in'? c.status.displayClock||'LIVE' : state==='pre'? c.status.type.shortDetail : 'FT';
let hEN=h.team.displayName,aEN=a.team.displayName;
return {h:nameAR[hEN]||hEN,a:nameAR[aEN]||aEN,hs:h.score||'0',as:a.score||'0',minute:minute,state:state,lg:league,sh:h.team.abbreviation?.slice(0,3).toUpperCase()||'H',sa:a.team.abbreviation?.slice(0,3).toUpperCase()||'A',logoH:logos[h.team.abbreviation?.slice(0,3).toUpperCase()]||'',logoA:logos[a.team.abbreviation?.slice(0,3).toUpperCase()]||''}
});
}catch{return []}
}

async function load365(){
let t=dateStr(0),am=dateStr(-1),gh=dateStr(1);
let promises=[];
for(let lg of leagues.filter(l=>l.id!=='all')){promises.push(bot365(lg.id,t));}
let all=await Promise.all(promises);
let tt=all.flat();
if(tt.length===0){
tt=[
{h:"الهلال",a:"الاتحاد",hs:"2",as:"1",minute:"FT 2-1",state:"post",lg:"sau.1",sh:"HIL",sa:"ITT",logoH:logos['HIL'],logoA:logos['ITT']},
{h:"مانشستر يونايتد",a:"تشيلسي",hs:"0",as:"1",minute:"67'",state:"in",lg:"eng.1",sh:"MAN",sa:"CHE",logoH:logos['MAN'],logoA:logos['CHE']},
{h:"مانشستر سيتي",a:"أرسنال",hs:"1",as:"0",minute:"34'",state:"in",lg:"eng.1",sh:"MCI",sa:"ARS",logoH:logos['MCI'],logoA:logos['ARS']},
{h:"برشلونة",a:"ريال مدريد",hs:"0",as:"0",minute:"22:00",state:"pre",lg:"esp.1",sh:"FCB",sa:"RMA",logoH:logos['FCB'],logoA:logos['RMA']}
];
}
tt.sort((a,b)=>{if(a.state==='in'&&b.state!=='in')return -1;if(b.state==='in'&&a.state!=='in')return 1;return 0;});
store.today=tt;
store.ams=tt;store.ghad=tt;
render();
}

function logoEl(abbr,url){
if(url) return `<img src="${url}" class="logo365img" onerror="this.style.display='none'">`;
return `<div class="logo365img" style="background:#6a2db8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px">${abbr}</div>`;
}

function render(){
let list=store[cur].filter(m=>curL==='all'||m.lg===curL);
let html='';
let grouped={};
list.forEach(m=>{if(!grouped[m.lg]) grouped[m.lg]=[];grouped[m.lg].push(m);});
for(let lg in grouped){
html+=`<div class="leagueHeader"><div>🏆 ${lg.toUpperCase()}</div><div>${grouped[lg].length} مباريات</div></div><div class="card365">`;
grouped[lg].forEach(m=>{
let badgeClass=m.state==='in'?'live365':m.state==='post'?'ft365':'soon365';
html+=`<div class="row365"><div class="team365">${logoEl(m.sh,m.logoH)}<span>${m.h}</span></div><div class="score365"><div class="num365">${m.hs} - ${m.as}</div><div class="minute365 ${badgeClass}">${m.minute}</div></div><div class="team365 right"><span>${m.a}</span>${logoEl(m.sa,m.logoA)}</div></div>`;
});
html+=`<div class="sloom365">ملخصات باسم سلوم تي في - sloomtv</div></div>`;
}
document.getElementById('list').innerHTML=html||'لا توجد مباريات';
}
function renderL(){let h='';leagues.forEach(l=>{h+=`<div class="chip365 ${curL===l.id?'active':''}" onclick="curL='${l.id}';renderL();render();">${lang==='ar'?l.n:l.en}</div>`});document.getElementById('lbar').innerHTML=h;}
window.show=(d)=>{cur=d;document.querySelectorAll('.tab365').forEach(t=>t.classList.remove('active'));document.getElementById(d==='today'?'tabToday':d==='ams'?'tabAms':'tabGhad').classList.add('active');render();}
function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lb').textContent=lang==='ar'?'EN / عربي':'عربي / EN';renderL();}
function clock(){let n=new Date();document.getElementById('ksa').textContent=n.toLocaleTimeString('en-GB',{timeZone:'Asia/Riyadh',hour12:false});document.getElementById('oma').textContent=n.toLocaleTimeString('en-GB',{timeZone:'Asia/Muscat',hour12:false});}
setInterval(clock,1000);clock();renderL();load365();setInterval(load365,15000);
</script>
</body>
</html>
