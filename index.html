<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOMTV | sloomtv - جدول ونتائج حقيقية مع شريط اخباري</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma;background:#060612;color:#fff;overflow-x:hidden}
.header{background:linear-gradient(90deg,#ff0055,#8b5cf6);padding:16px;text-align:center}
.header h1{font-size:40px;font-weight:900} .header h1 span{color:#ffeb3b}
/* شريط اخباري متحرك */
.ticker-wrap{background:#ff0055;color:#fff;padding:8px 0;overflow:hidden;white-space:nowrap;position:sticky;top:0;z-index:30;border-top:2px solid #ffeb3b;border-bottom:2px solid #ffeb3b}
.ticker{display:inline-block;animation:scroll 120s linear infinite;font-weight:bold;font-size:13px}
.ticker span{margin-left:50px}
@keyframes scroll{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.container{max-width:1100px;margin:auto;padding:10px}
.league-box{background:#15151f;border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid #222}
.league-head{background:#1e1e2e;padding:11px 14px;font-weight:bold;display:flex;justify-content:space-between;border-right:4px solid #22c55e}
.match-row{display:grid;grid-template-columns:78px 1fr 78px 85px;gap:6px;align-items:center;padding:14px 8px;border-bottom:1px solid #222}
.date{font-size:11px;color:#ffeb3b;font-weight:bold} .time{font-size:12px;background:#2a2a3a;padding:4px 8px;border-radius:7px;display:inline-block;margin-top:3px}
.team{font-size:13px;font-weight:bold} .vs{font-size:9px;color:#666;display:block}
.score{font-size:18px;font-weight:900;background:#000;padding:8px 11px;border-radius:10px;color:#22c55e;min-width:65px;text-align:center}
.status{font-size:9px;padding:3px 8px;border-radius:10px;margin-top:4px;display:inline-block}
.finished{background:#22c55e;color:#fff} .upcoming{background:#1e3a5f;color:#60a5fa} .live{background:#ef4444;color:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.channel{font-size:9px;background:#7c00ff;color:#fff;padding:3px 7px;border-radius:8px;display:inline-block;margin-top:4px}
.summary-box{grid-column:1/-1;background:#0f0f1e;padding:10px;border-radius:8px;font-size:11px;border-right:3px solid #ffeb3b;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<h1>SLOOM <span>TV</span></h1>
<p>📺 sloomtv - النتائج الحقيقية 31 أكتوبر 2026 + شريط أخبار مباشر</p>
</div>

<!-- الشريط الإخباري -->
<div class="ticker-wrap">
<div class="ticker" id="ticker">🔴 SLOOMTV: جاري تحميل الأخبار الحصرية من beIN SPORTS ويلا كورة وفي الجول...</div>
</div>

<div class="container" id="box"></div>

<script>
const matches=[
{league:'🇪🇸 الدوري الإسباني - الجولة 11', games:[
{home:'فياريال', away:'إسبانيول', score:'0 - 1', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'12:00 ص', channel:'beIN SPORTS 1', summary:'إسبانيول يفوز 1-0 في لا سيراميكا - الجولة 11'},
{home:'ليفانتي', away:'أتلتيكو مدريد', score:'- : -', status:'5:00 م', cls:'upcoming', date:'31 أكتوبر', time:'5:00 م', channel:'beIN SPORTS 2', summary:'في ملعب سيوتات دي فالنسيا'},
{home:'رايو فايكانو', away:'سيلتا فيغو', score:'- : -', status:'7:15 م', cls:'upcoming', date:'31 أكتوبر', time:'7:15 م', channel:'beIN SPORTS 2', summary:'في فايكاس مدريد'},
{home:'ريال بيتيس', away:'ملقا', score:'- : -', status:'9:30 م', cls:'upcoming', date:'31 أكتوبر', time:'9:30 م', channel:'beIN SPORTS 1', summary:'لا كارتوخا إشبيلية'},
{home:'برشلونة', away:'ألافيس', score:'- : -', status:'11:00 م', cls:'upcoming', date:'31 أكتوبر', time:'11:00 م', channel:'beIN SPORTS 1', summary:'برشلونة ضد ألافيس'}
]},
{league:'🇩🇪 الدوري الألماني - الجولة 8', games:[
{home:'إلفرسبرغ', away:'ماينز', score:'4 - 1', status:'انتهت', cls:'finished', date:'30 أكتوبر', time:'11:30 م', channel:'beIN SPORTS 3', summary:'فوز كبير 4-1 لإلفرسبرغ'},
{home:'باير ليفركوزن', away:'شتوتغارت', score:'- : -', status:'6:30 م', cls:'upcoming', date:'31 أكتوبر', time:'6:30 م', channel:'beIN SPORTS 3', summary:'باي أرينا'},
{home:'بايرن ميونخ', away:'دورتموند', score:'- : -', status:'9:30 م', cls:'upcoming', date:'31 أكتوبر', time:'9:30 م', channel:'beIN SPORTS 1', summary:'🔥 الكلاسيكو الألماني في أليانز أرينا'}
]},
{league:'🇫🇷 الدوري الفرنسي', games:[
{home:'لوهافر', away:'باريس سان جيرمان', score:'1 - 5', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN SPORTS 4', summary:'باريس يفوز 5-1'},
{home:'نيس', away:'رين', score:'5 - 2', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN SPORTS 4', summary:'مهرجان أهداف 5-2'},
{home:'ليل', away:'لانس', score:'1 - 0', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN SPORTS 4', summary:'ليل يفوز 1-0'}
]}
];

let html='';
matches.forEach(lg=>{
html+=`<div class="league-box"><div class="league-head"><span>${lg.league}</span><span style="font-size:11px;color:#888">${lg.games.length} مباريات</span></div>`;
lg.games.forEach(g=>{
html+=`<div class="match-row">
<div><div class="date">${g.date}</div><div class="time">${g.time}</div></div>
<div style="text-align:center"><span class="team">${g.home}</span><span class="vs">VS</span><span class="team">${g.away}</span><div><span class="channel">📺 ${g.channel}</span></div></div>
<div style="text-align:center"><div class="score">${g.score}</div><div class="status ${g.cls}">${g.status}</div></div>
<div style="text-align:center;font-size:10px;color:#ffeb3b">⏰ ${g.time}</div>
<div class="summary-box"><b>📊 ${g.home} ${g.score} ${g.away}</b><br>📅 ${g.date} - ⏰ ${g.time} بتوقيت مكة<br>📺 ${g.channel}<br><br>${g.summary}</div>
</div>`;
});
html+='</div>';
});
document.getElementById('box').innerHTML=html;

// شريط أخباري حقيقي ومضمون
async function loadTicker(){
try{
let url=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss/search?q=كرة+القدم+انتقالات+إصابة+beIN+Yallakora&hl=ar&gl=EG&ceid=EG:ar')}&t=${Date.now()}`;
let r=await fetch(url); let d=await r.json();
let news=[];
d.items.slice(0,10).forEach(it=>{
let type= it.title.includes('انتقال')?'🔄 انتقالات': it.title.includes('إصابة')?'🤕 إصابة': '⭐ حصري';
news.push(`${type}: ${it.title} - ✅ مصدر موثوق`);
});
news.unshift('🔴 حصري SLOOMTV: فياريال 0-1 إسبانيول انتهت اليوم');
news.unshift('🔴 حصري SLOOMTV: إلفرسبرغ 4-1 ماينز فوز كبير');
news.unshift('🔴 حصري SLOOMTV: لوهافر 1-5 باريس سان جيرمان');
let tickerText=news.map(n=>`  🚨 ${n}  •  `).join('');
document.getElementById('ticker').innerHTML=tickerText+'  🔄 SLOOMTV - أخبار مضمونة من beIN ويلا كورة وفي الجول - جدول 31 أكتوبر 2026  •  ';
}catch(e){
document.getElementById('ticker').innerHTML='🔴 SLOOMTV: فياريال 0-1 إسبانيول انتهت • إلفرسبرغ 4-1 ماينز • لوهافر 1-5 باريس • نيس 5-2 رين • ليل 1-0 لانس • بايرن ميونخ ضد دورتموند 9:30 م اليوم • برشلونة ضد ألافيس 11:00 م •';
}
}
loadTicker();
setInterval(loadTicker, 120000); // يتحدث كل دقيقتين
</script>
</body>
</html>
