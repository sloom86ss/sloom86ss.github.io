<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SloomTV مباشر</title>
<style>
body{background:#070b18;color:#fff;font-family:system-ui;padding:15px;margin:0}
h1{text-align:center;color:#00ff88}
.card{background:#151b2e;border-radius:14px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.score{background:#000;color:#00ff88;padding:6px 14px;border-radius:8px;font-size:22px;font-weight:bold}
.team{width:38%;text-align:center;font-weight:bold;font-size:14px}
.status{font-size:11px;color:#ff3355}
</style>
</head>
<body>
<h1>⚽ SloomTV مباشر</h1>
<div id="info" style="text-align:center;color:#888">جاري التحميل...</div>
<div id="matches"></div>

<script>
async function load(){
  const info=document.getElementById('info');
  const box=document.getElementById('matches');
  try{
    // API مجاني يشتغل على GitHub Pages
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/saudi-pro-league/scoreboard');
    const data = await res.json();
    
    if(!data.events || data.events.length==0){
      info.innerText="لا توجد مباريات اليوم في الدوري السعودي";
      // جرب كل الدوريات
      const res2 = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');
      const data2 = await res2.json();
      data.events = data2.events;
    }
    
    info.innerText="🔴 مباشر - يتحدث كل دقيقة";
    box.innerHTML="";
    
    data.events.forEach(ev=>{
      const comp = ev.competitions[0];
      const home = comp.competitors[0];
      const away = comp.competitors[1];
      const hs = home.score || '0';
      const as = away.score || '0';
      const st = comp.status.type.detail;
      
      box.innerHTML+=`
        <div class="card">
          <div class="team">${home.team.displayName}<br><span class="status">${st}</span></div>
          <div class="score">${hs} - ${as}</div>
          <div class="team">${away.team.displayName}</div>
        </div>
      `;
    });
  }catch(e){
    info.innerText="جاري المحاولة... "+e.message;
    console.log(e);
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
