<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOM TV LIVE - سلوم تيفي</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0}body{background:#000;color:#fff}
.head{padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#000;z-index:20;border-bottom:1px solid #111}
.logoBox{display:flex;align-items:center;gap:10px}
.logoImg{width:44px;height:44px;border-radius:12px;overflow:hidden;background:#111;border:1px solid #222;display:flex;align-items:center;justify-content:center}
.logoImg img{width:100%;height:100%;object-fit:cover}
.logoTxt{font-weight:900;font-size:18px;line-height:1}.logoTxt span{color:#00ff88;font-size:11px;display:block}
.tools{display:flex;gap:8px;align-items:center}
.iconBtn{width:36px;height:36px;background:#1c1c1c;border:1px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.timeBox{text-align:left;font-size:11px}.timeBox b{color:#00ff88}
.ticker{background:#00ff88;color:#000;overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:900;font-size:14px}
.ticker-track{display:inline-block;animation:scroll 15s linear infinite}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.tabs{display:flex;gap:8px;padding:10px;max-width:500px;margin:0 auto}
.tab{flex:1;padding:11px 4px;border-radius:22px;text-align:center;background:#1c1c1c;border:1px solid #222;font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:#00ff88;color:#000;font-weight:900}
.box{max-width:500px;margin:0 auto;padding:10px}
.leagueTitle{background:#1c1c1c;color:#00ff88;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:900;margin-top:14px;border:1px solid #222;display:flex;justify-content:space-between}
.card{background:#1c1c1c;border-radius:16px;padding:12px;margin-bottom:8px;border:1px solid #222;position:relative}
.cardLive{background:#00ff88;color:#000;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 4px 20px #00ff8844}
.row{display:flex;justify-content:space-between;align-items:center}
.sc{font-size:22px;font-weight:900;direction:ltr;text-align:center}
.tm{width:32%;text-align:center;font-size:13px;font-weight:700}
.badge{font-size:10px;padding:4px 8px;border-radius:10px;font-weight:900;margin-top:4px;display:inline-block}
.bLive{background:#000;color:#00ff88}.bFT{background:#333;color:#fff}.bPre{background:#333;color:#aaa}
.fav{position:absolute;top:8px;left:8px;cursor:pointer}
.newsCard{background:#1c1c1c;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #222;display:flex;gap:10px;align-items:center}
.newsCard img{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#222}
.newsTitle{font-size:13px;font-weight:700}
.statCard{background:#1c1c1c;border-radius:16px;padding:14px;margin-bottom:8px;border:1px solid #222;display:flex;justify-content:space-between}
.statCard b{color:#00ff88;font-size:18px}
.botBtn{position:fixed;bottom:20px;left:20px;width:52px;height:52px;background:#111;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;z-index:99}
.botPanel{position:fixed;bottom:80px;left:20px;right:20px;max-width:360px;background:#111;border:1px solid #222;border-radius:20px;padding:16px;z-index:98;display:none}
.botPanel.show{display:block}
.botOpt{padding:10px;background:#1c1c1c;border:1px solid #222;border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;font-size:13px}
</style>
</head>
<body>
<div class="head">
<div class="logoBox"><div class="logoImg"><img src="logo.png" alt="SLOOM"></div><div class="logoTxt">SLOOM TV LIVE<span>سلوم تيفي</span></div></div>
<div class="tools"><div class="iconBtn" onclick="toggleLang()" id="langBtn">EN</div><div class="iconBtn" onclick="toggleFavView()" id="favBtn">⭐</div><div class="timeBox"><div id="ksaTime">--:--</div><div id="mctTime">--:--</div></div></div>
</div>

<div class="ticker"><div class="ticker-track">SLOOM TV LIVE • سلوم تيفي مباشر • SLOOM TV LIVE • سلوم تيفي مباشر •</div></div>

<div class="tabs">
<div class="tab active" onclick="showTab('matches',this)">⚽ المباريات</div>
<div class="tab" onclick="showTab('stats',this)">📊 الإحصائيات</div>
<div class="tab" onclick="showTab('news',this)">📰 الأخبار</div>
</div>

<div class="box">
<div id="matchesTab"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>مباريات اليوم</b><span id="cnt" style="color:#777;font-size:11px"></span></div><div id="list">...</div></div>
<div id="statsTab" style="display:none"><div id="statsList"></div></div>
<div id="newsTab" style="display:none"><div id="newsList"></div></div>
</div>

<div class="botBtn" onclick="toggleBot()">⚙️</div>
<div class="botPanel" id="botPanel">
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>🤖 بوت التحكم</b><span onclick="toggleBot()" style="cursor:pointer">✕</span></div>
<div class="botOpt" onclick="doAction('all')">🔄 كل المباريات <span>All</span></div>
<div class="botOpt" onclick="doAction('live')">🔴 مباشر فقط <span>Live</span></div>
<div class="botOpt" onclick="doAction('fav')">⭐ المفضلة <span>Fav</span></div>
<div class="botOpt" onclick="doAction('eng')">🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجليزي <span>ENG</span></div>
<div class="botOpt" onclick="doAction('sau')">🇸🇦 روشن <span>SAU</span></div>
<div class="botOpt" onclick="doAction('refresh')">🔃 تحديث <span>↻</span></div>
</div>

<script>
let LANG='ar',filterMode='all',favOnly=false;
const LEAGUES=[{id:'eng.1',nameAr:'الإنجليزي 🏴󠁧󠁢󠁥󠁮󠁧󠁿',nameEn:'Premier League'},{id:'esp.1',nameAr:'الإسباني 🇪🇸',nameEn:'La Liga'},{id:'ita.1',nameAr:'الإيطالي 🇮🇹',nameEn:'Serie A'},{id:'ger.1',nameAr:'الألماني 🇩🇪',nameEn:'Bundesliga'},{id:'fra.1',nameAr:'الفرنسي 🇫🇷',nameEn:'Ligue 1'},{id:'sau.1',nameAr:'روشن 🇸🇦',nameEn:'Saudi League'},{id:'uefa.champions',nameAr:'الأبطال 🏆',nameEn:'Champions League'}];
let allMatches=[];
function toggleBot(){document.getElementById('botPanel').classList.toggle('show');}
function doAction(act){if(act==='all'){filterMode='all';favOnly=false;}if(act==='live'){filterMode='live';favOnly=false;}if(act==='fav'){favOnly=true;filterMode='all';}if(act==='eng'){filterMode='eng.1';}if(act==='sau'){filterMode='sau.1';}if(act==='refresh'){loadMatches();toggleBot();return;}renderMatches();toggleBot();}
function toggleLang(){LANG=LANG==='ar'?'en':'ar';document.getElementById('langBtn').textContent=LANG==='ar'?'EN':'ع';document.documentElement.dir=LANG==='ar'?'rtl':'ltr';renderMatches();loadStats();loadNews();}
function toggleFavView(){favOnly=!favOnly;document.getElementById('favBtn').style.background=favOnly?'#00ff88':'#1c1c1c';renderMatches();}
function getFav(){try{return JSON.parse(localStorage.getItem('sloom_fav')||'[]');}catch{return []}}
function toggleFav(id){let f=getFav();if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);localStorage.setItem('sloom_fav',JSON.stringify(f));renderMatches();}
function updateTimes(){let now=new Date();let ksa=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Riyadh'}));let mct=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Muscat'}));document.getElementById('ksaTime').innerHTML='🇸🇦 '+ksa.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});document.getElementById('mctTime').innerHTML='🇴🇲 '+mct.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}
setInterval(updateTimes,1000);updateTimes();
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('matchesTab').style.display=t==='matches'?'block':'none';document.getElementById('statsTab').style.display=t==='stats'?'block':'none';document.getElementById('newsTab').style.display=t==='news'?'block':'none';if(t==='stats')loadStats();if(t==='news')loadNews();}
async function loadMatches(){let date=new Date().toISOString().slice(0,10).replace(/-/g,'');allMatches=[];for(let lg of LEAGUES){try{let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.id}/scoreboard?dates=${date}`);let j=await r.json();(j.events||[]).forEach(ev=>{let c=ev.competitions[0],h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');allMatches.push({lgId:lg.id,lgAr:lg.nameAr,lgEn:lg.nameEn,id:ev.id,h:h.team.displayName,a:a.team.displayName,hs:h.score||'0',as:a.score||'0',state:c.status.type.state,min:c.status.type.state==='in'?(c.status.displayClock||'مباشر'):c.status.type.state==='pre'?new Date(c.date).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}):'انتهت',hAb:h.team.abbreviation||'',aAb:a.team.abbreviation||''});});}catch{}}if(allMatches.length===0){allMatches=[{lgId:'eng.1',lgAr:'الإنجليزي 🏴󠁧󠁢󠁥󠁮󠁧󠁿',lgEn:'Premier League',id:'1',h:'Arsenal',a:'Liverpool',hs:'0',as:'0',state:'pre',min:'07:30 م',hAb:'ARS',aAb:'LIV'},{lgId:'esp.1',lgAr:'الإسباني 🇪🇸',lgEn:'La Liga',id:'2',h:'Real Madrid',a:'Barcelona',hs:'1',as:'0',state:'in',min:'65\'',hAb:'RMA',aAb:'BAR'},{lgId:'sau.1',lgAr:'روشن 🇸🇦',lgEn:'Saudi League',id:'3',h:'Al Hilal',a:'Al Ittihad',hs:'2',as:'1',state:'post',min:'انتهت',hAb:'HIL',aAb:'ITT'}];}renderMatches();loadStats();}
function renderMatches(){let listEl=document.getElementById('list');let filtered=allMatches;if(favOnly){let fav=getFav();filtered=filtered.filter(m=>fav.includes(m.id));}if(filterMode==='live')filtered=filtered.filter(m=>m.state==='in');if(filterMode==='eng.1')filtered=filtered.filter(m=>m.lgId==='eng.1');if(filterMode==='sau.1')filtered=filtered.filter(m=>m.lgId==='sau.1');if(filtered.length===0){listEl.innerHTML=`<div style="text-align:center;color:#777;padding:30px">لا توجد مباريات</div>`;return;}document.getElementById('cnt').textContent=filtered.filter(x=>x.state==='in').length+' مباشر • '+filtered.length;let grouped={};filtered.forEach(m=>{let k=LANG==='ar'?m.lgAr:m.lgEn;if(!grouped[k])grouped[k]=[];grouped[k].push(m);});let html='';for(let lgName in grouped){html+=`<div class="leagueTitle"><span>${lgName}</span><span>${grouped[lgName].length}</span></div>`;grouped[lgName].forEach(m=>{let isLive=m.state==='in';let fav=getFav();let isFav=fav.includes(m.id);html+=`<div class="${isLive?'cardLive':'card'}"><div class="fav" onclick="toggleFav('${m.id}')">${isFav?'⭐':'☆'}</div><div class="row"><div class="tm">${m.h}<div style="font-size:10px;opacity:.6">${m.hAb}</div></div><div style="text-align:center;width:36%"><div class="sc">${m.hs} : ${m.as}</div><div class="badge ${isLive?'bLive':m.state==='post'?'bFT':'bPre'}">${m.min}</div></div><div class="tm">${m.a}<div style="font-size:10px;opacity:.6">${m.aAb}</div></div></div></div>`;});}listEl.innerHTML=html;}
function loadStats(){let live=allMatches.filter(x=>x.state==='in').length;let total=allMatches.length||3;let finished=allMatches.filter(x=>x.state==='post').length||1;let upcoming=allMatches.filter(x=>x.state==='pre').length||1;document.getElementById('statsList').innerHTML=`<div class="statCard"><span>📅 مباريات اليوم / Today</span><b>${total}</b></div><div class="statCard"><span>🔴 مباشر / Live</span><b>${live}</b></div><div class="statCard"><span>✅ منتهية / Finished</span><b>${finished}</b></div><div class="statCard"><span>⏰ قادمة / Upcoming</span><b>${upcoming}</b></div><div class="statCard"><span>⭐ المفضلة / Favorites</span><b>${getFav().length}</b></div><div class="statCard"><span>🏆 الدوريات / Leagues</span><b>7</b></div>`;}
async function loadNews(){let html='';try{let r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/news?limit=6');let j=await r.json();if(j.articles){j.articles.forEach(a=>{html+=`<div class="newsCard"><img src="${a.images?.[0]?.url||'logo.png'}"><div><div class="newsTitle">${a.headline}</div><div style="font-size:10px;color:#777;margin-top:4px">ESPN • اليوم</div></div></div>`;});}}catch{}if(!html){html=`<div class="newsCard"><img src="logo.png"><div><div class="newsTitle">أرسنال يواجه ليفربول في قمة الجولة - من يحسم الصدارة؟</div><div style="font-size:10px;color:#777">SLOOM TV LIVE • اليوم</div></div></div><div class="newsCard"><img src="logo.png"><div><div class="newsTitle">ريال مدريد يستعد لكلاسيكو ناري أمام برشلونة</div><div style="font-size:10px;color:#777">SLOOM TV LIVE • اليوم</div></div></div><div class="newsCard"><img src="logo.png"><div><div class="newsTitle">الهلال السعودي يواصل صدارته لدوري روشن</div><div style="font-size:10px;color:#777">SLOOM TV LIVE • اليوم</div></div></div>`;}document.getElementById('newsList').innerHTML=html;}
loadMatches();setInterval(loadMatches,60000);
</script>
</body>
</html>
