
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلوم تيفي | SLOOM TV</title>
<meta name="description" content="سلوم تيفي - نتائج مباريات كرة القدم المباشرة ومواعيد المباريات">
<meta name="theme-color" content="#121212">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Tajawal,sans-serif}
body{margin:0;background:#121212;color:#fff}
.header{background:#1f1f1f;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #00d084;position:sticky;top:0;z-index:10}
.logo{background:linear-gradient(135deg,#6a2db8,#00d084);padding:9px 17px;border-radius:10px;font-weight:900;font-size:19px}
.live-label{background:#00d084;color:#000;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900}
.ticker{background:#b81736;padding:9px;text-align:center;font-size:12px;font-weight:900;min-height:36px}
.time{display:flex;justify-content:space-around;background:#1f1f1f;padding:10px;color:#aaa;font-size:12px}
.time b{color:#fff}
.wrap{max-width:650px;margin:auto;padding:10px}
.title{background:#1f1f1f;color:#00d084;padding:13px;text-align:center;border-radius:10px;font-weight:900;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:11px 5px;background:#292929;border:0;border-radius:8px;color:#aaa;font-weight:900;cursor:pointer}
.tab.active{background:#00d084;color:#000}
.filters{display:flex;gap:7px;overflow-x:auto;padding:5px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#292929;color:#fff;border:1px solid #444;border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}
.chip.active{background:#6a2db8;border-color:#6a2db8}
.league{background:#1f1f1f;color:#00d084;padding:10px;border-radius:9px 9px 0 0;font-size:12px;font-weight:900;margin-top:10px}
.match{background:#1f1f1f;border:1px solid #303030;padding:13px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.team{width:38%;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.team:last-child{justify-content:flex-end}
.team img{width:29px;height:29px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.score{width:24%;text-align:center}
.numbers{font-size:19px;font-weight:900;direction:ltr}
.status{display:inline-block;margin-top:4px;padding:4px 7px;border-radius:12px;font-size:10px;font-weight:900;background:#333;color:#ddd}
.status.live{background:#ff1744;color:#fff}
.status.pre{background:#00d084;color:#000}
.status.done{background:#333;color:#aaa}
.footer{background:#161616;text-align:center;color:#777;padding:9px;font-size:10px}
.message{background:#1f1f1f;border:1px solid #333;border-radius:10px;padding:22px;text-align:center;color:#bbb;margin:12px 0;line-height:2}
.refresh{display:block;margin:12px auto;background:#00d084;color:#000;border:0;border-radius:8px;padding:10px 20px;font-weight:900;cursor:pointer}
.small{font-size:11px;color:#888;text-align:center;margin:10px}
@keyframes blink{50%{opacity:.5}}
.status.live{animation:blink 1.2s infinite}
@media(max-width:380px){.team{font-size:10px}.team img{width:24px;height:24px}.numbers{font-size:16px}.tab{font-size:11px}}
</style>
</head>

<body>
<header class="header">
  <div class="logo">سلوم تيفي</div>
  <div class="live-label">● LIVE</div>
</header>

<div class="ticker" id="ticker">سلوم تيفي | جاري تحميل المباريات...</div>

<div class="time">
  <div>🇴🇲 مسقط <b id="oma">--:--:--</b></div>
  <div>🇸🇦 الرياض <b id="ksa">--:--:--</b></div>
</div>

<main class="wrap">
  <div class="title" id="pageTitle">مباريات اليوم</div>

  <div class="tabs">
    <button class="tab" data-day="-1" onclick="selectDay(-1,this)">الأمس</button>
    <button class="tab active" data-day="0" onclick="selectDay(0,this)">اليوم</button>
    <button class="tab" data-day="1" onclick="selectDay(1,this)">الغد</button>
  </div>

  <div class="filters" id="filters"></div>
  <div id="matches">
    <div class="message">جاري تحميل المباريات...</div>
  </div>

  <button class="refresh" onclick="loadAll()">تحديث النتائج ↻</button>
  <div class="small">يتم جلب البيانات من خدمة ESPN الرياضية. قد تختلف التغطية حسب الدوري.</div>
</main>

<footer class="footer">© SLOOM TV - سلوم تيفي</footer>

<script>
const leagues=[
 {id:"all",name:"كل الدوريات"},
 {id:"sau.1",name:"الدوري السعودي"},
 {id:"eng.1",name:"الدوري الإنجليزي"},
 {id:"esp.1",name:"الدوري الإسباني"},
 {id:"ita.1",name:"الدوري الإيطالي"},
 {id:"ger.1",name:"الدوري الألماني"},
 {id:"fra.1",name:"الدوري الفرنسي"},
 {id:"uefa.champions",name:"دوري الأبطال"}
];

const arabicNames={
 "Al Hilal":"الهلال","Al-Hilal":"الهلال",
 "Al Nassr":"النصر","Al-Nassr":"النصر",
 "Al Ittihad":"الاتحاد","Al-Ittihad":"الاتحاد",
 "Al Ahli":"الأهلي","Al-Ahli":"الأهلي",
 "Manchester United":"مانشستر يونايتد",
 "Manchester City":"مانشستر سيتي",
 "Chelsea":"تشيلسي","Arsenal":"أرسنال",
 "Liverpool":"ليفربول","Barcelona":"برشلونة",
 "Real Madrid":"ريال مدريد","Atletico Madrid":"أتلتيكو مدريد",
 "Bayern Munich":"بايرن ميونخ",
 "Paris Saint-Germain":"باريس سان جيرمان"
};

let selectedDay=0;
let selectedLeague="all";
let matches={ "-1":[], "0":[], "1":[] };
let loading=false;

function dateForOffset(offset){
 const parts=new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Muscat",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).formatToParts(new Date());

 const p={};
 parts.forEach(x=>p[x.type]=x.value);

 const d=new Date(Date.UTC(
  Number(p.year),Number(p.month)-1,Number(p.day)+offset
 ));

 return d.getUTCFullYear()+
  String(d.getUTCMonth()+1).padStart(2,"0")+
  String(d.getUTCDate()).padStart(2,"0");
}

function teamName(name){
 return arabicNames[name]||name||"فريق";
}

async function getLeagueMatches(league,date){
 const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${date}`;

 try{
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok) throw new Error("API error");

  const data=await response.json();
  if(!Array.isArray(data.events)) return [];

  return data.events.map(event=>{
   const competition=event.competitions?.[0];
   if(!competition) return null;

   const home=competition.competitors?.find(x=>x.homeAway==="home");
   const away=competition.competitors?.find(x=>x.homeAway==="away");
   if(!home||!away) return null;

   const status=competition.status?.type;
   const state=status?.state||"pre";

   return {
    home:teamName(home.team?.displayName),
    away:teamName(away.team?.displayName),
    homeScore:home.score??"-",
    awayScore:away.score??"-",
    homeLogo:home.team?.logo||"",
    awayLogo:away.team?.logo||"",
    league:league,
    state:state,
    clock:state==="in"
      ?(competition.status?.displayClock||"مباشر")
      :state==="post"
       ?(status?.shortDetail||"انتهت")
       :(status?.shortDetail||"لم تبدأ"),
    kickoff:event.date||""
   };
  }).filter(Boolean);

 }catch(error){
  console.warn("تعذر تحميل الدوري:",league,error);
  return [];
 }
}

async function getDay(offset){
 const date=dateForOffset(offset);

 const results=await Promise.all(
  leagues.filter(x=>x.id!=="all")
   .map(x=>getLeagueMatches(x.id,date))
 );

 return results.flat().sort((a,b)=>{
  if(a.state==="in"&&b.state!=="in") return -1;
  if(b.state==="in"&&a.state!=="in") return 1;
  return new Date(a.kickoff)-new Date(b.kickoff);
 });
}

async function loadAll(){
 if(loading)return;
 loading=true;

 document.getElementById("matches").innerHTML=
  '<div class="message">جاري تحديث النتائج...</div>';

 try{
  const days=await Promise.all([-1,0,1].map(async offset=>{
   return [offset,await getDay(offset)];
  }));

  days.forEach(([offset,data])=>{
   matches[String(offset)]=data;
  });

  render();
  updateTicker();

 }catch(error){
  document.getElementById("matches").innerHTML=
   '<div class="message">تعذر تحميل البيانات حالياً. تحقق من اتصال الإنترنت وحاول مجدداً.</div>';
 }finally{
  loading=false;
 }
}

function logo(url){
 if(!url)return "";
 return `<img src="${url}" loading="lazy" alt="" onerror="this.style.display='none'">`;
}

function render(){
 const title=selectedDay===-1?"مباريات الأمس":
  selectedDay===1?"مباريات الغد":"مباريات اليوم";

 document.getElementById("pageTitle").textContent=title;

 let list=matches[String(selectedDay)]||[];

 if(selectedLeague!=="all"){
  list=list.filter(x=>x.league===selectedLeague);
 }

 const container=document.getElementById("matches");

 if(!list.length){
  container.innerHTML=
   '<div class="message">لا توجد مباريات مسجلة لهذا اليوم أو تعذر جلب بياناتها من المصدر.</div>';
  return;
 }

 const groups={};

 list.forEach(match=>{
  if(!groups[match.league])groups[match.league]=[];
  groups[match.league].push(match);
 });

 let html="";

 Object.keys(groups).forEach(id=>{
  const league=leagues.find(x=>x.id===id);
  html+=`<div class="league">${league?.name||id.toUpperCase()} · ${groups[id].length} مباريات</div>`;

  groups[id].forEach(m=>{
   const statusClass=m.state==="in"?"live":
    m.state==="post"?"done":"pre";

   html+=`
    <div class="match">
     <div class="team">${logo(m.homeLogo)}<span>${m.home}</span></div>
     <div class="score">
      <div class="numbers">${m.homeScore} - ${m.awayScore}</div>
      <span class="status ${statusClass}">${m.clock}</span>
     </div>
     <div class="team">${logo(m.awayLogo)}<span>${m.away}</span></div>
    </div>`;
  });

  html+='<div class="footer">SLOOM TV | سلوم تيفي</div>';
 });

 container.innerHTML=html;
}

function renderFilters(){
 document.getElementById("filters").innerHTML=
  leagues.map(l=>`
   <button class="chip ${selectedLeague===l.id?"active":""}"
    onclick="selectLeague('${l.id}')">${l.name}</button>
  `).join("");
}

function selectLeague(id){
 selectedLeague=id;
 renderFilters();
 render();
}

function selectDay(day,button){
 selectedDay=day;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 button.classList.add("active");
 render();
}

function updateTicker(){
 const live=matches["0"].filter(x=>x.state==="in");

 document.getElementById("ticker").textContent=live.length
  ? "🔴 مباشر الآن: "+live.map(x=>
    `${x.home} ${x.homeScore}-${x.awayScore} ${x.away}`
   ).join(" | ")
  : "سلوم تيفي | تابع نتائج ومواعيد مباريات اليوم";
}

function updateClocks(){
 const now=new Date();

 document.getElementById("oma").textContent=
  now.toLocaleTimeString("en-GB",{timeZone:"Asia/Muscat",hour12:false});

 document.getElementById("ksa").textContent=
  now.toLocaleTimeString("en-GB",{timeZone:"Asia/Riyadh",hour12:false});
}

renderFilters();
updateClocks();
setInterval(updateClocks,1000);
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
