function renderGames(filter){
let list=filter==='all'?games:games.filter(g=>g.key===filter);
let html='';
let grouped={};
list.forEach(g=>{ if(!grouped[g.lg]) grouped[g.lg]=[]; grouped[g.lg].push(g); });
for(let lg in grouped){
html+=`<div class="card"><div class="head"><span>${lg}</span><span class="badge">✅ مضمون 100%</span></div>`;
grouped[lg].forEach(g=>{
html+=`<div class="match">
<div><div class="time">${g.date}</div><div style="font-size:11px;background:#1a1a33;padding:4px 8px;border-radius:8px;display:inline-block;margin-top:4px">${g.time}</div><div class="ch">📺 ${g.ch}</div></div>

<div><div class="score">${g.score}</div><div class="status ${g.cls}">${g.st}</div></div>
${g.yt?`<div class="video"><b style="font-size:11px">🎥 ملخص فيديو حصري - ${g.home} ${g.score} ${g.away} - beIN SPORTS</b><iframe src="${g.yt}" allowfullscreen></iframe><div style="font-size:9px;color:#888;margin-top:6px">📺 beIN SPORTS - ملخص حصري - سلوم تيفي - ✅ مضمون 100%</div></div>`:''}
<div class="goals"><b>⚽ مجريات وأهداف:</b><br>${g.goals.replace(/\n/g,'<br>')}</div>
</div>`;
});
html+='</div>';
}
document.getElementById('matches').innerHTML=html;
}

function renderTables(filter){
let list=filter==='all'?fullTablesData:fullTablesData.filter(t=>t.key===filter);
let html='';

html+=`<div class="card"><div class="head"><span>${tbl.name}</span><span class="badge">من 1 إلى ${tbl.teams.length} - ✅</span></div><div style="overflow:auto"><table class="table"><tr><th>#</th><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>ع</th><th>نقاط</th></tr>`;

let cls=i<4?'top4':i>=tbl.teams.length-3?'bot':'mid';
html+=`<tr class="${cls}"><td>${i+1}</td><td style="text-align:right;font-weight:700;cursor:pointer" onclick="openTeam('${t.n}')">${t.n} 👆</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td style="color:#ffeb3b;font-weight:800">${t.pts}</td></tr>`;

html+=`</table></div><div style="padding:8px;font-size:10px;color:#666">📊 سلوم تيفي - ترتيب كامل - ✅ مضمون 100% - تحديث ${new Date().toLocaleTimeString('ar-EG')}</div></div>`;
});
document.getElementById('tables').innerHTML=html;
}
