<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سـلوم تيفي | SLOOMTV</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#080810;color:#fff;overflow-x:hidden}
.h{background:linear-gradient(135deg,#14142a,#1e1e4a);padding:20px;text-align:center;border-bottom:3px solid #ff0040}
.logo{font-size:42px;font-weight:900;line-height:1}.logo span{color:#ffeb3b}
.badge{background:#0f2815;border:1px solid #22c55e;color:#22c55e;padding:6px 16px;border-radius:30px;display:inline-block;font-size:12px;margin-top:10px;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
.ticker{background:#ff0040;color:#fff;padding:8px;text-align:center;font-size:13px;font-weight:700}
.container{max-width:750px;margin:0 auto;padding:15px}
.card{background:#12122a;border:1px solid #222;border-radius:16px;padding:18px;margin-bottom:15px}
.match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.team{font-weight:800;font-size:18px}.score{font-size:32px;font-weight:900;color:#ffeb3b}
.time{font-size:12px;color:#22c55e;font-weight:700}
.events{border-top:1px solid #222;padding-top:12px;margin-top:12px}
.event{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #222;font-size:14px}
.event .min{color:#ff0040;font-weight:800;min-width:35px}
.summary{background:#1a1a35;border-radius:10px;padding:12px;margin-top:12px;font-size:14px;line-height:1.6;color:#ccc}
.auto-update{text-align:center;color:#888;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="h">
<div class="logo">SLOOM<span>TV</span></div>
<div class="badge">● LIVE - تحديث تلقائي كل 30 ثانية</div>
</div>
<div class="ticker">⚽ مجريات المباريات - تحديث مستمر</div>

<div class="container">

<!-- مباراة 1 -->
<div class="card">
<div class="match-head">
<div class="team">لوهافر</div>
<div style="text-align:center"><div class="score">1 - 5</div><div class="time">انتهت</div></div>
<div class="team">باريس</div>
</div>

<div class="events">
<div class="event"><span class="min">12'</span><span>⚽ هدف باريس - ديمبيلي</span></div>
<div class="event"><span class="min">35'</span><span>⚽ هدف لوهافر</span></div>
<div class="event"><span class="min">58'</span><span>⚽ هدف باريس - مبابي</span></div>
<div class="event"><span class="min">78'</span><span>🔄 تبديل لوهافر</span></div>
</div>

<div class="summary">
<b>ملخص:</b> فوز كبير لباريس خارج أرضه بخماسية، سيطرة كاملة بعد الدقيقة 50.
</div>
</div>

<!-- تقدر تكرر الكارد لكل مباراة -->

</div>

<div class="auto-update">آخر تحديث: <span id="time"></span> | يتحدث تلقائياً</div>

<script>
// تحديث الوقت + تحديث تلقائي للصفحة كل 30 ثانية
function updateTime(){
document.getElementById('time').innerText = new Date().toLocaleTimeString('ar-EG');
}
updateTime();
setInterval(updateTime,1000);
setInterval(()=>{ location.reload(); }, 30000); // تحديث الصفحة كل 30 ثانية
</script>

</body>
</html>
