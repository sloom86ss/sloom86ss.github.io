<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="1to1lmgptPdQBO6SsdgpAv8meSroswl34D89V78Xvnk" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOMTV - نتائج مباشرة تلقائية</title>
<meta name="description" content="SLOOMTV - نتائج مباشرة تلقائية لجميع مباريات اليوم من كل الدوريات">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#080810;color:#fff}
.h{background:linear-gradient(135deg,#14142a,#1e1e4a);padding:20px;text-align:center;border-bottom:3px solid #ff0040}
.logo{font-size:42px;font-weight:900}.logo span{color:#ffeb3b}
.badge{background:#0f2815;border:1px solid #22c55e;color:#22c55e;padding:6px 16px;border-radius:30px;display:inline-block;font-size:12px;margin-top:10px;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
.ticker{background:#ff0040;color:#fff;padding:8px;text-align:center;font-size:13px;font-weight:700}
.container{max-width:750px;margin:0 auto;padding:15px}
.card{background:#12122a;border:1px solid #222;border-radius:16px;padding:18px;margin-bottom:15px}
.match-head{display:flex;justify-content:space-between;align-items:center}
.team{font-weight:800;font-size:16px;width:90px;text-align:center}
.score{font-size:32px;font-weight:900;color:#ffeb3b;text-align:center}
.status{font-size:11px;color:#22c55e;font-weight:700;text-align:center;margin-top:4px}
.league{font-size:11px;color:#888;margin-bottom:10px;text-align:center}
.article-card{background:#12122a;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:14px;border-right:4px solid #ffeb3b}
.auto-update{text-align:center;color:#888;font-size:11px;margin-top:20px}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<div class="h">
<div class="logo">SLOOM<span>TV</span></div>
<div class="badge">● LIVE - نتائج تلقائية من جميع الدوريات</div>
</div>
<div class="ticker">⚽ النتائج تتحدث تلقائيا كل 60 ثانية</div>

<div class="container" id="matches">
<div class="loading">جاري جلب المباريات الحية... ⏳</div>
</div>

<div class="auto-update">آخر تحديث: <span id="time"></span> | تحديث تلقائي كل 60 ثانية</div>

<script>
// جلب المباريات تلقائيا
async function loadMatches(){
  try{
    const today = new Date().toISOString().split('T')[0].replace(/-/g,'');
    // نجيب مباريات اليوم من كل الدوريات
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=${new Date().toISOString().split('T')[0]}`);
    const data = await res.json();
    
    // لو مافي مباريات انجليزية، نجيب كل المباريات
    let events = data.events || [];
    
    // جلب دوريات اضافية
    const leagues = ['fra.1','esp.1','ger.1','ita.1','saudi.1'];
    for(let lg of leagues){
      try{
        const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);
        const d = await r.json();
        if(d.events) events = events.concat(d.events.slice(0,3));
      }catch(e){}
    }

    const container = document.getElementById('matches');
    container.innerHTML = '';

    if(events.length === 0){
      container.innerHTML = `
      <div class="card"><div class="match-head">
      <div class="team">لوهافر</div>
      <div style="text-align:center"><div class="score">1 - 5</div><div class="status">انتهت</div></div>
      <div class="team">باريس</div>
      </div><div style="text-align:center;color:#888;font-size:12px;margin-top:10px">الدوري الفرنسي - نتيجة محفوظة</div></div>`;
    }

    events.slice(0,12).forEach(ev=>{
      const comp = ev.competitions[0];
      const home = comp.competitors[0];
      const away = comp.competitors[1];
      const status = comp.status.type.state;
      let statusText = 'لم تبدأ';
      if(status === 'in') statusText = 'مباشر ●';
      if(status === 'post') statusText = 'انتهت';
      
      container.innerHTML += `
      <div class="card">
      <div class="league">${ev.leagues ? ev.leagues[0].name : ev.competitions[0].league || 'كرة القدم'}</div>
      <div class="match-head">
      <div class="team">${home.team.abbreviation || home.team.displayName}</div>
      <div style="text-align:center"><div class="score">${home.score || 0} - ${away.score || 0}</div><div class="status">${statusText} ${comp.status.displayClock || ''}</div></div>
      <div class="team">${away.team.abbreviation || away.team.displayName}</div>
      </div>
      </div>`;
    });

    // قسم المقالات الصحفية (ثابت - تقدر تغيره)
    container.innerHTML += `
    <div style="margin-top:25px">
    <div style="font-size:20px;font-weight:900;border-right:4px solid #ff0040;padding-right:12px;margin-bottom:15px">📰 مقالات وتحليلات</div>
    <div class="article-card">
    <h3 style="margin:5px 0">مبابي يواصل التألق مع باريس بعد خماسية لوهافر</h3>
    <p style="color:#aaa;font-size:13px">تحليل لأداء باريس سان جيرمان بعد الفوز الكبير 5-1 وأبرز النقاط التكتيكية التي حسمت اللقاء.</p>
    </div>
    </div>`;

  }catch(err){
    console.log(err);
    document.getElementById('matches').innerHTML = '<div class="loading">خطأ في الجلب - سيتم المحاولة مرة أخرى</div>';
  }
}

function updateTime(){
document.getElementById('time').innerText = new Date().toLocaleTimeString('ar-EG');
}
updateTime();
loadMatches();
setInterval(updateTime,1000);
setInterval(loadMatches,60000); // تحديث كل دقيقة
</script>

</body>
</html>
