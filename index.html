<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SloomTV - Live</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:system-ui;padding:15px}
h1{text-align:center;color:#00ff88}
.card{background:#151b2e;border-radius:12px;padding:15px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.team{font-weight:bold;width:40%;text-align:center}
.score{font-size:24px;color:#00ff88;font-weight:bold;background:#000;padding:5px 12px;border-radius:8px}
.live{color:#ff0040;font-size:12px}
</style>
</head>
<body>
<h1>⚽ SloomTV مباشر</h1>
<div id="loading" style="text-align:center">جاري التحميل...</div>
<div id="matches"></div>
<script>
async function load(){
 const res = await fetch('https://www.thesportsdb.com/api/v1/json/3/livescore.php');
 const data = await res.json();
 const c = document.getElementById('matches');
 document.getElementById('loading').style.display='none';
 c.innerHTML='';
 if(!data.events){c.innerHTML='<p style="text-align:center">لا يوجد لايف الان</p>';return}
 data.events.forEach(m=>{
  c.innerHTML+=`<div class="card"><div class="team">${m.strHomeTeam}<br><span class="live">● ${m.strStatus}</span></div><div class="score">${m.intHomeScore||0} - ${m.intAwayScore||0}</div><div class="team">${m.strAwayTeam}<br><span style="font-size:11px;color:#888">${m.strLeague}</span></div></div>`;
 });
}
load(); setInterval(load,30000);
</script>
</body>
</html>
