<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOMTV | ملخصات وأخبار الأندية - AI كل 30 ثانية</title>
<style>
body{margin:0;font-family:Tahoma;background:#060612;color:#fff}
.header{background:linear-gradient(90deg,#ff0055,#8b5cf6);padding:14px;text-align:center;position:sticky;top:0;z-index:50}
.header h1{font-size:36px;margin:0;font-weight:900} .header h1 span{color:#ffeb3b}
.ai{font-size:11px;background:#000;border:1px solid #22c55e;color:#22c55e;padding:5px 12px;border-radius:20px;display:inline-block;margin-top:5px}
.ticker-wrap{background:#ff0055;color:#fff;padding:8px 0;overflow:hidden;white-space:nowrap;position:sticky;top:72px;z-index:40;border-top:2px solid #ffeb3b;border-bottom:2px solid #ffeb3b}
.ticker{display:inline-block;animation:scroll 110s linear infinite;font-weight:bold;font-size:12px}
@keyframes scroll{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.nav{display:flex;gap:6px;justify-content:center;padding:10px;background:#0f0f1e;position:sticky;top:108px;z-index:30;flex-wrap:wrap}
.nav button{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:11px;cursor:pointer}
.nav button.active{background:#ff0055;border-color:#ff0055;font-weight:bold}
.container{max-width:1150px;margin:auto;padding:10px}
.bar{display:flex;justify-content:space-between;background:#15151f;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:11px;border:1px solid #222}
.league-box{background:#15151f;border-radius:14px;margin-bottom:12px;overflow:hidden;border:1px solid #222}
.league-head{background:#1e1e2e;padding:11px 14px;font-weight:bold;display:flex;justify-content:space-between;border-right:4px solid #22c55e}
.match-row{display:grid;grid-template-columns:78px 1fr 78px 80px;gap:6px;align-items:center;padding:12px 8px;border-bottom:1px solid #222}
.date{font-size:10px;color:#ffeb3b;font-weight:bold} .time{font-size:11px;background:#2a2a3a;padding:4px 7px;border-radius:7px;display:inline-block}
.team{font-size:13px;font-weight:bold} .vs{font-size:9px;color:#666;display:block}
.score{font-size:18px;font-weight:900;background:#000;padding:8px 11px;border-radius:10px;color:#22c55e;min-width:65px;text-align:center}
.status{font-size:8px;padding:3px 8px;border-radius:10px;margin-top:4px;display:inline-block}
.finished{background:#22c55e;color:#fff} .upcoming{background:#1e3a5f;color:#60a5fa}
.channel{font-size:9px;background:#7c00ff;color:#fff;padding:3px 7px;border-radius:8px;display:inline-block;margin-top:4px}
.summary-box{grid-column:1/-1;background:#0f0f1e;padding:12px;border-radius:8px;font-size:11px;border-right:3px solid #ffeb3b;margin-top:8px;line-height:1.8}
.news-card{background:#15151f;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #222;display:flex;gap:10px}
.news-card.club{border-right:4px solid #3b82f6} .news-card.trans{border-right:4px solid #22c55e} .news-card.inj{border-right:4px solid #ef4444} .news-card.exc{border-right:4px solid #f59e0b}
.club-logo{width:42px;height:42px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="header">
<h1>SLOOM <span>TV</span></h1>
<div class="ai">🤖 AI LIVE - ملخصات وأخبار الأندية - تحديث كل 30 ثانية</div>
</div>
<div class="ticker-wrap"><div class="ticker" id="ticker">🤖 SLOOMTV AI: تحميل ملخصات وأخبار الأندية...</div></div>
<div class="nav">
<button class="active" onclick="showTab('matches',this)">📊 الجدول</button>
<button onclick="showTab('summary',this)">🎥 الملخصات</button>
<button onclick="showTab('clubs',this)">🏟️ أخبار الأندية</button>
<button onclick="showTab('news',this)">📰 انتقالات وإصابات</button>
</div>
<div class="container">
<div class="bar"><div>🤖 <span id="aiStatus">AI يحدث...</span></div><div>⏰ <span id="lastUpdate"></span> | 🔄 كل 30 ثانية</div></div>
<div id="matchesSec"><div id="matchesBox"></div></div>
<div id="summarySec" style="display:none"><div id="summaryBox"></div></div>
<div id="clubsSec" style="display:none"><div id="clubsBox"></div></div>
<div id="newsSec" style="display:none"><div id="newsBox"></div></div>
</div>

<script>
let counter=0;
const matches=[
{league:'🇪🇸 الإسباني - الجولة 11', games:[
{home:'فياريال', away:'إسبانيول', en_home:'Villarreal', en_away:'Espanyol', score:'0 - 1', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'12:00 ص', channel:'beIN 1', goals:'⚽ د 68 - كارلوس روميرو (إسبانيول)<br>🟨 د 45 - فياريال<br>📊 استحواذ: 62% فياريال', summary:'ملخص كامل: إسبانيول يخطف فوز ثمين 1-0 في ملعب لا سيراميكا. هدف روميرو في الدقيقة 68.'},
{home:'برشلونة', away:'ألافيس', score:'- : -', status:'11:00 م', cls:'upcoming', date:'31 أكتوبر', time:'11:00 م', channel:'beIN 1', goals:'لم تبدأ بعد - توقع تشكيلة برشلونة: ليفاندوفسكي أساسي', summary:'برشلونة يستضيف ألافيس - آخر 5 مواجهات: 4 فوز برشلونة'}
]},
{league:'🇩🇪 الألماني - الجولة 8', games:[
{home:'إلفرسبرغ', away:'ماينز', score:'4 - 1', status:'انتهت', cls:'finished', date:'30 أكتوبر', time:'11:30 م', channel:'beIN 3', goals:'⚽ د 12 - جان زيمر (إلفرسبرغ)<br>⚽ د 32 - بول فينتر (إلفرسبرغ)<br>⚽ د 54 - أمين الدخيل (ماينز)<br>⚽ د 67 - كيفن كونراد (إلفرسبرغ)<br>⚽ د 89 - لوكا بفايفر (إلفرسبرغ)', summary:'ملخص مهرجان أهداف: إلفرسبرغ يكتسح ماينز 4-1 في مباراة مثيرة.'},
{home:'بايرن ميونخ', away:'دورتموند', score:'- : -', status:'9:30 م - القمة', cls:'upcoming', date:'31 أكتوبر', time:'9:30 م', channel:'beIN 1', goals:'الكلاسيكو - هاري كين ضد جيراسي', summary:'🔥 ملخص متوقع: بايرن ضد دورتموند - أليانز أرينا - 75 ألف متفرج'}
]},
{league:'🇫🇷 الفرنسي', games:[
{home:'لوهافر', away:'باريس', score:'1 - 5', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN 4', goals:'⚽ د 8 - ديمبيلي (باريس)<br>⚽ د 15 - مبابي (باريس)<br>⚽ د 33 - لوهافر يقلص<br>⚽ د 61 - باركولا (باريس)<br>⚽ د 78 - مبابي (باريس)<br>⚽ د 85 - راموس (باريس)', summary:'ملخص: باريس يكتسح لوهافر 5-1 - ثنائية مبابي.'},
{home:'نيس', away:'رين', score:'5 - 2', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN 4', goals:'⚽ 5 أهداف لنيس - مهرجان', summary:'ملخص: نيس يمطر شباك رين بخماسية 5-2'},
{home:'ليل', away:'لانس', score:'1 - 0', status:'انتهت', cls:'finished', date:'31 أكتوبر', time:'انتهت', channel:'beIN 4', goals:'⚽ د 73 - جوناثان ديفيد (ليل)', summary:'ملخص: ليل يفوز 1-0 بهدف ديفيد القاتل.'}
]}
];

const clubsNews=[
{club:'الهلال', logo:'🔵', news:'🔵 حصري SLOOMTV: الهلال يحسم صفقة جناح برازيلي - الكشف الطبي غداً - مصدر موثوق من النادي', type:'club', time:'منذ 15 دقيقة'},
{club:'النصر', logo:'🟡', news:'🟡 عاجل: إصابة رونالدو خفيفة - سيشارك ضد الهلال - طبيب النصر يؤكد', type:'inj', time:'منذ 32 دقيقة'},
{club:'برشلونة', logo:'🔵🔴', news:'🔵🔴 برشلونة: لامين يامال يعود للتدريبات - جاهز لمباراة ألافيس اليوم 11:00 م', type:'club', time:'منذ 45 دقيقة'},
{club:'ريال مدريد', logo:'⚪', news:'⚪ ريال مدريد: فينيسيوس يغيب شهر - إصابة عضلية - أنشيلوتي يبحث عن بديل', type:'inj', time:'منذ ساعة'},
{club:'باريس', logo:'🔴🔵', news:'🔴🔵 باريس بعد الفوز 5-1 على لوهافر: مبابي يتصدر الهدافين - 12 هدف', type:'exc', time:'منذ ساعتين'},
{club:'بايرن ميونخ', logo:'🔴', news:'🔴 بايرن قبل الكلاسيكو ضد دورتموند 9:30 م: كين جاهز - توخيل: سنفوز', type:'club', time:'منذ 3 ساعات'},
{club:'مان سيتي', logo:'🩵', news:'🩵 مان سيتي: هالاند يعود - سيشارك ضد برايتون غداً', type:'club', time:'منذ 4 ساعات'}
];

function render(){
let html=''; let sumHtml=''; let clubsHtml='';
matches.forEach(lg=>{
html+=`<div class="league-box"><div class="league-head"><span>${lg.league}</span><span style="font-size:10px;color:#22c55e">🤖 AI</span></div>`;
lg.games.forEach(g=>{
html+=`<div class="match-row">
<div><div class="date">${g.date}</div><div class="time">${g.time}</div></div>
<div style="text-align:center"><span class="team">${g.home}</span><span class="vs">VS</span><span class="team">${g.away}</span><div><span class="channel">📺 ${g.channel}</span></div></div>
<div style="text-align:center"><div class="score">${g.score}</div><div class="status ${g.cls}">${g.status}</div></div>
<div style="text-align:center">⏰ ${g.time}</div>
<div class="summary-box"><b>🎥 ملخص ${g.home} ${g.score} ${g.away}</b><br><br>${g.goals}<br><br>📝 ${g.summary}<br><br><small>⏰ ${g.time} - 📺 ${g.channel} - 🤖 SLOOMTV AI</small></div>
</div>`;
sumHtml+=`<div class="league-box"><div class="league-head">🎥 ملخص ${g.home} ${g.score} ${g.away} - ${g.time}</div><div style="padding:12px;font-size:12px;line-height:1.9">📅 ${g.date} - ⏰ ${g.time} بتوقيت مكة<br>📺 ${g.channel}<br>🏟️ ${lg.league}<br><br><b>⚽ الأهداف:</b><br>${g.goals}<br><br><b>📝 الملخص الكامل:</b><br>${g.summary}<br><br><small>🤖 SLOOMTV AI - تحديث كل 30 ثانية</small></div></div>`;
});
html+='</div>';
});
document.getElementById('matchesBox').innerHTML=html;
document.getElementById('summaryBox').innerHTML=sumHtml;

// اخبار الأندية
clubsNews.forEach(c=>{
clubsHtml+=`<div class="news-card ${c.type}"><div class="club-logo">${c.logo}</div><div style="flex:1"><div style="font-size:12px;font-weight:bold;line-height:1.6">${c.news}</div><div style="font-size:10px;color:#888;margin-top:5px;display:flex;gap:8px"><span>🏟️ ${c.club}</span><span>⏰ ${c.time}</span><span>✅ مصدر موثوق - sloomtv</span></div></div></div>`;
});
document.getElementById('clubsBox').innerHTML=clubsHtml;
document.getElementById('lastUpdate').innerText=new Date().toLocaleTimeString('ar-EG');
}

async function aiTicker(){
try{
let url=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss/search?q=الهلال+النصر+برشلونة+ريال+مدريد&hl=ar&gl=EG&ceid=EG:ar')}&t=${Date.now()}`;
let r=await fetch(url); let d=await r.json();
let news=[];
if(d.items){
d.items.slice(0,6).forEach(it=>news.push(`⭐ ${it.title}`));
}
news.unshift('🔵 الهلال: صفقة برازيلية - الكشف غداً');
news.unshift('🟡 النصر: رونالدو جاهز ضد الهلال');
news.unshift('🎥 ملخص: لوهافر 1-5 باريس - ثنائية مبابي');
news.unshift('🎥 ملخص: إلفرسبرغ 4-1 ماينز - مهرجان أهداف');
news.unshift('🤖 AI LIVE: فياريال 0-1 إسبانيول انتهت');
let txt=news.map(n=>` 🚨 ${n} • `).join('')+` 🤖 SLOOMTV AI - ملخصات وأخبار الأندية كل 30 ثانية • `;
document.getElementById('ticker').innerHTML=txt;
}catch(e){
document.getElementById('ticker').innerHTML='🤖 AI: فياريال 0-1 إسبانيول • إلفرسبرغ 4-1 ماينز • لوهافر 1-5 باريس • نيس 5-2 رين • الهلال صفقة برازيلية • النصر رونالدو جاهز • برشلونة يامال يعود • تحديث AI كل 30 ثانية • ';
}
// اخبار انتقالات واصابات
let newsHtml='';
clubsNews.slice(0,5).forEach(c=>{
newsHtml+=`<div class="news-card ${c.type}"><div class="club-logo">${c.logo}</div><div style="flex:1"><div style="font-size:12px;font-weight:bold">${c.news}</div><div style="font-size:10px;color:#888;margin-top:4px">⏰ ${c.time} - ✅ sloomtv</div></div></div>`;
});
document.getElementById('newsBox').innerHTML=newsHtml;
}

function showTab(tab,btn){
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
document.getElementById('matchesSec').style.display=tab=='matches'?'block':'none';
document.getElementById('summarySec').style.display=tab=='summary'?'block':'none';
document.getElementById('clubsSec').style.display=tab=='clubs'?'block':'none';
document.getElementById('newsSec').style.display=tab=='news'?'block':'none';
}

render(); aiTicker();
setInterval(()=>{ counter++; document.getElementById('aiStatus').innerText=`AI LIVE - التحديث القادم بعد ${30-counter} ثانية`; if(counter>=30) counter=0; },1000);
setInterval(()=>{ counter=0; render(); aiTicker(); },30000);
</script>
</body>
</html>
