<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوم للمباريات اليوم | بث مباشر وملخصات وأهداف</title>
<meta name="description" content="موقع سلوم للمباريات اليوم - ملخصات وأهداف جميع المباريات، نتائج مباشرة لكل دوريات العالم">
<style>
body{font-family:Tahoma;background:#f5f5f5;margin:0}
.header{background:#111;color:#fff;padding:20px;text-align:center}
.live-bar{background:#d00;color:#fff;padding:10px;text-align:center;font-weight:bold}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.match{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee}
.badge{background:#007bff;color:#fff;padding:3px 8px;border-radius:5px;font-size:12px}
.video-box{margin-top:10px}
.video-box iframe{width:100%;height:220px;border-radius:10px;border:0}
.video-title{font-weight:bold;margin:8px 0}
</style>
</head>
<body>
<div class="header"><h1>⚽ سلوم للمباريات اليوم</h1><p id="today"></p></div>
<div class="live-bar">🔴 ملخصات وأهداف اليوم - جميع دوريات العالم</div>

<div class="container" id="content">
</div>

<script>
document.getElementById('today').innerText = new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

let html = `
<div class="card"><h2>⚽ مباريات اليوم</h2>
<div class="match"><span>الهلال vs النصر - 9:00 م</span><span class="badge">السعودي</span></div>
<div class="match"><span>برشلونة vs ريال مدريد - 10:00 م</span><span class="badge">الإسباني</span></div>
<div class="match"><span>مان سيتي vs ليفربول - 6:30 م</span><span class="badge">الإنجليزي</span></div>
</div>

<div class="card">
<h2>🎥 ملخصات وأهداف اليوم</h2>
<p style="color:#666">يتم التحديث تلقائياً بعد نهاية كل مباراة</p>

<div class="video-box">
<div class="video-title">ملخص مباراة الهلال والنصر - أهداف اليوم</div>
<iframe src="https://www.youtube.com/embed/?listType=search&list=ملخص+الهلال+والنصر+اليوم" allowfullscreen></iframe>
</div>

<div class="video-box">
<div class="video-title">ملخص مباريات الدوري الإسباني اليوم</div>
<iframe src="https://www.youtube.com/embed/?listType=search&list=ملخص+الدوري+الاسباني+اليوم" allowfullscreen></iframe>
</div>

<div class="video-box">
<div class="video-title">أهداف دوري أبطال أوروبا اليوم</div>
<iframe src="https://www.youtube.com/embed/?listType=search&list=اهداف+دوري+ابطال+اوروبا+اليوم" allowfullscreen></iframe>
</div>

</div>

<div class="card"><h2>🏆 لماذا سلوم للمباريات اليوم؟</h2>
<p>نقدم لك ملخصات وأهداف سريعة بعد المباراة مباشرة لجميع دوريات العالم - السعودي، الإسباني، الإنجليزي، دوري أبطال أوروبا.</p>
</div>
`;
document.getElementById('content').innerHTML = html;
</script>
</body>
</html>
