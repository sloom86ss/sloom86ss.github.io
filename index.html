<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOM TV LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#f5f5f7;color:#111;padding-bottom:15px}
.top{padding:10px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:30}
.days{display:flex;gap:12px;padding:10px;background:#fff;overflow-x:auto;border-bottom:1px solid #eee}
.day{font-size:11px;text-align:center;min-width:60px;color:#888}
.day.active{color:#5a189a;font-weight:900;border-bottom:2px solid #5a189a}
.sloom-ticker{background:#5a189a;color:#fff;height:36px;overflow:hidden;display:flex;align-items:center;position:relative}
.track{display:flex;animation:marq 120s linear infinite;gap:60px;white-space:nowrap}
.track span{font-size:13px;font-weight:700}
@keyframes marq{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.league{background:#fff;margin-top:8px;padding:10px 12px;font-weight:900;display:flex;justify-content:space-between;border-bottom:1px solid #eee}
.card{background:#fff;border:1.5px solid #e8e8e8;border-radius:16px;margin:8px 10px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.card.live{border-color:#0a8a0a}
.team{width:90px;text-align:center}.team img{width:42px;height:42px}.ar{font-size:11px;font-weight:800;margin-top:4px}
.center{flex:1;text-align:center}.minute{color:#0a8a0a;font-weight:900;font-size:18px;direction:ltr}.score{font-weight:900;font-size:22px}
.bot-status{position:fixed;top:60px;left:10px;background:#111;color:#0f0;padding:4px 10px;border-radius:20px;font-size:10px;z-index:50}
#modal{position:fixed;inset:0;background:#f5f5f7;z-index:100;display:none;overflow:auto}
</style>
</head>
<body>
<div class="top"><div style="font-weight:900">SLOOM TV 🔴 LIVE</div><div>☰ 🔍</div></div>
<div class="days"><div class="day">29 أكتوبر</div><div class="day">30 أكتوبر</div><div class="day active">اليوم 31 أكتوبر</div><div class="day">01 نوفمبر</div></div>
<div class="sloom-ticker"><div class="track" id="track"></div></div>
<div class="bot-status" id="bot">🤖 BOT يحدث...</div>
<div id="all"></div>
<div id="modal"><div style="background:#111;color:#fff;padding:14px"><button onclick="document.getElementById('modal').style.display='none'" style="background:#333;color:#fff;border:0;padding:6px 14px;border-radius:20px">✕ إغلاق</button><div id="mContent" style="padding:12px;text-align:center;margin-top:20px">تفاصيل المباراة</div></div></div>
<script>
const AR={"Al Hilal":"الهلال","Al Nassr":"النصر","Al Ittihad":"الاتحاد","Al Ahli":"الأهلي","Al Shabab":"الشباب","Al Ettifaq":"الاتفاق","Al Taawoun":"التعاون","Al Fateh":"الفتح","Al Faisaly":"الفيصلي","Al Fayha":"الفيحاء","Sunderland":"سندرلاند","Brentford":"برينتفورد","Manchester City":"مانشستر سيتي","Arsenal":"أرسنال","Liverpool":"ليفربول"};
function ar(n){return AR[n]||n;}
const LEAGUES=[{id:'ksa.1',name:'🇸🇦 دوري روشن السعودي'},{id:'eng.1',name:'🏴󠁧󠁢󠁥󠁮󠁧󠁿 الدوري الإنجليزي الممتاز'},{id:'esp.1',name:'🇪🇸 الدوري الإسباني'}];
function ticker(){
 let now=new Date();
 let ksa=now.toLocaleTimeString('ar-SA',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit'});
 let oman=now.toLocaleTimeString('ar-SA',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit'});
 let msgs=[`🔴 SLOOM TV مباشر - 🇴🇲 عمان ${oman} | 🇸🇦 السعودية ${ksa}`,`🤖 البوت يحدث كل 30 ثانية - لحظة بلحظة`,`🇸🇦 الهلال - النصر - الاتحاد - الأهلي - الاتفاق - التعاون`,`⚽ جميع المباريات بتوقيت السعودية وعمان`];
 document.getElementById('track').innerHTML=msgs.concat(msgs).map(m=>`<span>${m} • </span>`).join('');
}
setInterval(ticker,1000);ticker();
async function BOT_UPDATE(){
 document.getElementById('bot').textContent=`🤖 BOT يحدث ${new Date().toLocaleTimeString('ar-SA',{timeZone:'Asia/Riyadh'})}`;
 let all=document.getElementById('all'); all.innerHTML='';
 for(let lg of LEAGUES){
  try{
   let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.id}/scoreboard`);
   let data=await r.json();
   if(!data.events) continue;
   all.innerHTML+=`<div class="league"><span>${lg.name}</span><span style="color:#0a8a0a">● ${data.events.length} مباريات</span></div>`;
   data.events.slice(0,5).forEach(ev=>{
    let comp=ev.competitions[0];let h=comp.competitors[0];let a=comp.competitors[1];
    let isLive=comp.status.type.state==='in';let minute=comp.status.type.detail||'';
    let matchTime=new Date(ev.date);
    let ksaTime=matchTime.toLocaleTimeString('ar-SA',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit'});
    let omanTime=matchTime.toLocaleTimeString('ar-SA',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit'});
    let logoH=h.team.logos?.[0]?.href||`https://a.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${h.team.id}.png&w=60`;
    let logoA=a.team.logos?.[0]?.href||`https://a.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${a.team.id}.png&w=60`;
    all.innerHTML+=`<div class="card ${isLive?'live':''}"><div class="team"><img src="${logoH}"><div class="ar">${ar(h.team.displayName)}</div><div style="font-size:9px;color:#888">قادمة</div></div><div class="center"><div class="score">${h.score||0} - ${a.score||0}</div><div class="minute">${isLive?minute:ksaTime+' م'}</div><div style="font-size:9px">🇴🇲 ${omanTime}</div></div><div class="team"><img src="${logoA}"><div class="ar">${ar(a.team.displayName)}</div><div style="font-size:9px;color:#888">KSA ${ksaTime}</div></div></div>`;
   });
  }catch(e){}
 }
}
BOT_UPDATE();setInterval(BOT_UPDATE,30000);
</script>
</body>
</html>
