<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوم تيفي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif;margin:0}body{background:#0a0a0a;color:#fff;overflow-x:hidden}
.headerApp{background:#0a0a0a;padding:14px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;border-bottom:1px solid #1a1a1a}
.logoApp{background:#c6ff00;color:#000;padding:8px 20px;border-radius:20px;font-weight:900;font-size:18px}
.liveTop{background:#c6ff00;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.appWrap{max-width:420px;margin:0 auto;padding:10px}
.cardDark{background:#1a1a1a;border-radius:24px;padding:14px;margin-bottom:12px;border:1px solid #2a2a2a}
.cardLime{background:#c6ff00;border-radius:20px;padding:14px;margin-bottom:12px;color:#000}
.dateBar{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin-bottom:10px}.dateItem{padding:8px 12px;background:#242424;border-radius:16px;text-align:center;min-width:42px;font-size:11px;color:#aaa;border:1px solid #333}.dateItem.active{background:#c6ff00;color:#000}
.liveCard{background:#1a1a1a;border-radius:20px;padding:12px;margin-bottom:10px;border:1px solid #2a2a2a}
.liveScore{font-size:20px;font-weight:900}
.probBar{height:5px;background:#333;border-radius:5px;display:flex;margin-top:8px;overflow:hidden}.probBar div{height:100%}
.sloomBar{text-align:center;padding:8px;background:#111;color:#c6ff00;font-size:10px;font-weight:700;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div class="headerApp"><div class="logoApp">سلوم تيفي</div><div class="liveTop">● LIVE</div></div>
<div class="appWrap">
<div class="cardDark">
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>مباريات اليوم</b><span style="color:#aaa;font-size:12px" id="count">جاري...</span></div>
<div class="dateBar" id="dateBar"></div>
<div id="list">جاري تحميل المباريات...</div>
<div class="sloomBar">ملخصات باسم سلوم تي في - sloomtv</div>
</div>
</div>

<script>
let dates=['12 Sun','13 Mon','14 Tue','15 Wed','16 Thu','17 Fri','18 Sat'];document.getElementById('dateBar').innerHTML=dates.map((d,i)=>`<div class="dateItem ${i===3?'active':''}"><div>${d.split(' ')[1]}</div><div style="font-weight:900">${d.split(' ')[0]}</div></div>`).join('');

async function load(){
 let r=await fetch('/api/live');let j=await r.json();
 document.getElementById('count').textContent=j.live.length+' مباشر';
 let html='';
 j.all.slice(0,8).forEach(m=>{
  html+=`<div class="${m.state==='in'?'cardLime':'liveCard'}">
  <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px"><span>${m.league.toUpperCase()}</span><span>${m.minute}</span></div>
  <div style="display:flex;justify-content:space-between;align-items:center">
  <div style="text-align:center;width:30%"><div style="width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:900;margin:0 auto">${m.homeAbbr}</div><div style="font-size:11px;font-weight:900;margin-top:4px">${m.hAR}</div></div>
  <div style="text-align:center;width:40%"><div style="font-size:24px;font-weight:900">${m.hs} : ${m.as}</div></div>
  <div style="text-align:center;width:30%"><div style="width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:900;margin:0 auto">${m.awayAbbr}</div><div style="font-size:11px;font-weight:900;margin-top:4px">${m.aAR}</div></div>
  </div>
  <div class="probBar"><div style="width:${m.prob}%;background:${m.state==='in'?'#000':'#c6ff00'}"></div><div style="width:${100-m.prob}%;background:#6a2db8"></div></div>
  </div>`;
 });
 document.getElementById('list').innerHTML=html;
}
load();setInterval(load,10000);
</script>
</body>
</html>
