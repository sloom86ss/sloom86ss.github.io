<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOM TV LIVE - البث المباشر</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
  body{font-family:'Tajawal',sans-serif;background:#0a0e13;color:#fff;margin:0;padding:0}
  .header{background:linear-gradient(90deg,#0d1b2a,#1b263b);padding:15px;text-align:center;border-bottom:3px solid #00ff88;position:sticky;top:0;z-index:100}
  .logo{font-size:28px;font-weight:900;color:#00ff88}
  .logo span{color:#fff}
  /* الساعة الاحترافية */
  .clock-box{background:linear-gradient(135deg,#111827,#1f2937);border:1px solid #00ff8855;border-radius:15px;padding:15px;margin:15px;text-align:center;box-shadow:0 0 20px #00ff8822}
  .clock-time{font-size:36px;font-weight:900;letter-spacing:2px;color:#00ff88;text-shadow:0 0 10px #00ff88}
  .clock-date{font-size:14px;color:#9ca3af;margin-top:5px}
  .clock-city{font-size:12px;color:#00ff88;background:#00ff8822;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:8px}
  .match-card{background:#111827;margin:12px;border-radius:12px;padding:15px;border-right:4px solid #00ff88}
  .league{color:#00ff88;font-size:13px;font-weight:700}
  .teams{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:18px;font-weight:700}
  .vs{color:#666}
  .live-badge{background:red;color:#fff;padding:2px 8px;border-radius:5px;font-size:11px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
  .btn{background:#00ff88;color:#000;padding:10px;border-radius:8px;text-align:center;font-weight:900;margin-top:10px;display:block;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <div class="logo">SLOOM <span>TV LIVE</span></div>
</div>

<!-- الساعة الاحترافية -->
<div class="clock-box">
  <div class="clock-time" id="clock">00:00:00</div>
  <div class="clock-date" id="date">جاري التحميل...</div>
  <div class="clock-city">📍 توقيت مسقط - البريمي 🇴🇲</div>
</div>

<div class="match-card">
  <div class="league">🏆 دوري روشن السعودي <span class="live-badge">● مباشر</span></div>
  <div class="teams">
    <span>التعاون</span><span class="vs">1 - 1</span><span>الاتفاق</span>
  </div>
  <a class="btn" href="#">شاهد التفاصيل مباشر</a>
</div>

<div class="match-card">
  <div class="league">🏆 دوري روشن السعودي <span class="live-badge">● مباشر 84'</span></div>
  <div class="teams">
    <span>الفيحاء</span><span class="vs">3 - 1</span><span>الفيصلي</span>
  </div>
  <a class="btn" href="#">تابع المباراة لحظة بلحظة</a>
</div>

<script>
// ساعة احترافية بتوقيت مسقط
function updateClock(){
  const now = new Date();
  // توقيت مسقط GMT+4
  const optionsTime = {timeZone:'Asia/Muscat',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'};
  const optionsDate = {timeZone:'Asia/Muscat',weekday:'long',year:'numeric',month:'long',day:'numeric'};
  
  document.getElementById('clock').textContent = now.toLocaleTimeString('ar-EG',optionsTime);
  document.getElementById('date').textContent = now.toLocaleDateString('ar-EG',optionsDate);
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
