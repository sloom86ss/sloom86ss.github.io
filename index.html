<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوم للمباريات اليوم | جدول مرتب حسب الدوريات</title>
<style>
body{margin:0;font-family:Tahoma;background:#08080f;color:#fff}
.header{background:linear-gradient(90deg,#8b5cf6,#3b82f6);padding:20px;text-align:center}
.header h1{margin:0;font-size:28px}
.container{max-width:1000px;margin:auto;padding:15px}
.league-group{background:#15151f;border-radius:15px;margin-bottom:20px;overflow:hidden;border:1px solid #222}
.league-head{background:#1e1e2e;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;border-right:4px solid #8b5cf6}
.league-head span{font-size:14px}
.match-row{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;border-bottom:1px solid #222}
.match-row:last-child{border:0}
.match-row:hover{background:#1f1f2f}
.teams{flex:1}
.team-name{font-weight:bold}
.vs{color:#666;margin:0 10px}
.score-box{background:#000;color:#22c55e;padding:6px 12px;border-radius:8px;font-weight:bold;min-width:60px;text-align:center}
.live{color:#fff;background:#ef4444;padding:4px 8px;border-radius:20px;font-size:10px;margin-right:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.date{color:#888;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<div class="header"><h1>⚽ سلوم للمباريات اليوم</h1><p>جدول مرتب حسب الدوريات - كل العالم</p><p id="today" style="font-size:12px;opacity:.8"></p></div>
<div class="container" id="groups"><div style="text-align:center;padding:30px">⏳ جاري ترتيب الدوريات...</div></div>
<script>
document.getElementById('today').innerText=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
async function load(){
try{
let res=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard');
let data=await res.json();
let leagues={};
data.events.forEach(ev=>{
let lgName=ev.leagues && ev.leagues[0] ? ev.leagues[0].name : 'دوريات أخرى';
if(!leagues[lgName]) leagues[lgName]=[];
leagues[lgName].push(ev);
});
let html='';
for(let lg in leagues){
let icon='🏆';
if(lg.includes('Saudi') || lg.includes('سعودي')) icon='🇸🇦';
else if(lg.includes('LaLiga') || lg.includes('Spanish') || lg.includes('Esp')) icon='🇪🇸';
else if(lg.includes('Premier') || lg.includes('England')) icon='🏴󠁧󠁢󠁥󠁮󠁧󠁿';
else if(lg.includes('Serie') || lg.includes('Italy')) icon='🇮🇹';
else if(lg.includes('Bundes') || lg.includes('German')) icon='🇩🇪';
else if(lg.includes('Ligue') || lg.includes('France')) icon='🇫🇷';
else if(lg.includes('Champions')) icon='⭐';
html+=`<div class="league-group"><div class="league-head"><span>${icon} ${lg}</span><span style="color:#888;font-size:12px">${leagues[lg].length} مباريات</span></div>`;
leagues[lg].forEach(ev=>{
let home=ev.competitions[0].competitors[0];
let away=ev.competitions[0].competitors[1];
let isLive=ev.status.type.name=='STATUS_IN_PROGRESS';
let scoreH=home.score||'0';
let scoreA=away.score||'0';
let d=new Date(ev.date);
let time=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
html+=`<div class="match-row"><div class="teams"><div><span class="team-name">${home.team.displayName}</span><span class="vs">VS</span><span class="team-name">${away.team.displayName}</span>${isLive?'<span class="live">🔴 مباشر</span>':''}</div><div class="date">📅 ${time}</div></div><div class="score-box">${scoreH} - ${scoreA}</div></div>`;
});
html+='</div>';
}
document.getElementById('groups').innerHTML=html||'<p>لا توجد مباريات اليوم</p>';
}catch(e){document.getElementById('groups').innerHTML='<p style="text-align:center">جاري التحديث...</p>';}
}
load(); setInterval(load,30000);
</script>
</body>
</html>
