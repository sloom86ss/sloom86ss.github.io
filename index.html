<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوم تيفي - sloomtv</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{margin:0;background:#0f0f0f;color:#fff}
.top{background:#1a1a1a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00ff88}
.top b{color:#00ff88;font-size:22px}
.top span{color:#ffeb3b}
.lang{background:#00ff88;color:#000;border:none;border-radius:20px;padding:5px 14px;font-weight:900;font-size:12px}
.clock-bar{background:#222;padding:8px 15px;display:flex;justify-content:space-between;font-size:12px;color:#aaa}
.clock-bar #clock{color:#00ff88;font-weight:900}
.bots{background:#111;display:grid;grid-template-columns:repeat(10,1fr);gap:1px;padding:1px}
.bots div{background:#1e1e1e;text-align:center;padding:6px 2px;font-size:8px;color:#888}
.bots b{color:#00ff88;display:block;font-size:9px}
.league{padding:12px 15px;font-weight:900;color:#00ff88;font-size:14px;display:flex;justify-content:space-between;background:#151515;margin-top:10px}
.card{background:#1e1e1e;border-radius:18px;border:1px solid #333;margin:8px 10px;padding:14px 12px;display:flex;justify-content:space-between;align-items:center}
.card .team{width:28%;text-align:center;font-size:12px;font-weight:700;color:#fff}
.card .score{width:44%;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:900}
.card .score .min{color:#00ff88;font-size:18px}
</style>
</head>
<body>

<div class="top">
  <div><b>SLOOMTV</b> <span>LIVE | سلوم تيفي - sloomtv</span></div>
  <button class="lang">عربي / EN</button>
</div>

<div class="clock-bar">
  <div>📍 البريمي 🇴🇲 - مسقط</div>
  <div id="clock">22:30:00</div>
  <div>10 BOTS ● LIVE</div>
</div>

<div class="bots" id="botsGrid"></div>

<div class="league"><span>⌃</span><span>الدوري الإنجليزي الممتاز - مباشر</span></div>

<div id="matches"></div>

<script>
const data=[
  {h:"كوفتنري",a:"سندرلاند",hs:3,as:1,m:"71'"},
  {h:"برينتفورد",a:"نوتنغهام",hs:1,as:0,m:"72'"},
  {h:"هال",a:"إبسويتش",hs:1,as:1,m:"69'"},
  {h:"مان سيتي",a:"برايتون",hs:0,as:1,m:"70'"},
  {h:"بورنموث",a:"ليدز",hs:1,as:0,m:"68'"},
];
function render(){
  let html='';
  data.forEach(d=>{
    html+=`<div class="card">
      <div class="team">${d.h}</div>
      <div class="score"><span>${d.hs}</span><span class="min">${d.m}</span><span>${d.as}</span></div>
      <div class="team">${d.a}</div>
    </div>`;
  });
  document.getElementById('matches').innerHTML=html;
}
render();

const bots=["روشن","PL","LaLiga","Bundes","SerieA","Ligue1","UCL","AFC","Europa","Cup"];
const grid=document.getElementById('botsGrid');
bots.forEach((n,i)=>{
  const el=document.createElement('div');
  el.innerHTML=`<b>BOT ${i+1}</b>${n}<br><span id="b${i}">OK</span>`;
  grid.appendChild(el);
  setInterval(()=>{
    document.getElementById(`b${i}`).textContent=new Date().toLocaleTimeString('ar-EG',{timeZone:'Asia/Muscat',hour12:false,second:'2-digit'});
  },(5+i)*800);
});

setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('ar-EG',{timeZone:'Asia/Muscat',hour12:false});
},1000);
</script>
</body>
</html>
