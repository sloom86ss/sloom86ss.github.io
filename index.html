<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOM TV | أخبار مضمونة من beIN SPORTS ويلا كورة</title>
<style>
body{margin:0;font-family:Tahoma;background:#0a0a12;color:#fff}
.header{background:linear-gradient(90deg,#ff0055,#8b5cf6);padding:20px;text-align:center}
.header h1{margin:0;font-size:38px;font-weight:900}
.header h1 span{color:#ffeb3b}
.sources-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#111;font-size:10px}
.source-badge{padding:5px 10px;border-radius:15px;background:#222;border:1px solid #333}
.source-badge.trusted{border-color:#22c55e;color:#22c55e}
.ticker{background:#ff0055;color:#fff;padding:8px;overflow:hidden;white-space:nowrap;font-weight:bold}
.ticker span{display:inline-block;animation:scroll 80s linear infinite}
@keyframes scroll{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.container{max-width:1000px;margin:auto;padding:12px}
.news-card{background:#15151f;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222;display:flex;gap:12px;align-items:flex-start}
.news-card:hover{background:#1c1c2a}
.news-img{width:50px;height:50px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.news-content{flex:1}
.news-title{font-size:13px;line-height:1.6;margin-bottom:6px;font-weight:bold}
.news-meta{display:flex;gap:10px;font-size:10px;color:#888;align-items:center;flex-wrap:wrap}
.meta-source{background:#22c55e;color:#fff;padding:2px 8px;border-radius:10px;font-size:9px}
.meta-source.bein{background:#7c00ff}.meta-source.yalla{background:#d00}.meta-source.filgoal{background:#004d00}.meta-source.kooora{background:#0a3d9c}
.type-badge{padding:3px 8px;border-radius:10px;font-size:9px;color:#fff}
.type-transfers{background:#22c55e}.type-injury{background:#ef4444}.type-exclusive{background:#f59e0b}.type-official{background:#3b82f6}
</style>
</head>
<body>
<div class="header">
<h1>SLOOM <span>TV</span></h1>
<p>📺 أخبار مضمونة وحصرية من مصادر موثوقة</p>
<p id="today" style="font-size:11px;opacity:.8"></p>
</div>
<div class="sources-bar">
<span class="source-badge trusted">✅ beIN SPORTS موثوق</span>
<span class="source-badge trusted">✅ يلا كورة موثوق</span>
<span class="source-badge trusted">✅ في الجول موثوق</span>
<span class="source-badge trusted">✅ كووورة موثوق</span>
<span class="source-badge">⭐ حصري SLOOM TV</span>
</div>
<div class="ticker"><span id="ticker">🔴 SLOOM TV: أخبار مضمونة من beIN SPORTS - يلا كورة - في الجول - كووورة...</span></div>
<div class="container">
<div id="newsBox" style="text-align:center;padding:20px">⏳ جاري جلب الأخبار المضمونة من المصادر الموثوقة...</div>
</div>
<script>
document.getElementById('today').innerText=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' - '+new Date().toLocaleTimeString('ar-EG');

function timeAgo(d){
let diff=Math.floor((Date.now()-d)/1000);
if(diff<60) return `منذ ${diff} ثانية`;
if(diff<3600) return `منذ ${Math.floor(diff/60)} دقيقة`;
if(diff<86400) return `منذ ${Math.floor(diff/3600)} ساعة`;
return `منذ ${Math.floor(diff/86400)} يوم`;
}

async function loadTrustedNews(){
let trustedSources=[
{url:'https://www.yallakora.com/rss.aspx', name:'يلا كورة', cls:'yalla', icon:'⚽'},
{url:'https://www.filgoal.com/rss', name:'في الجول', cls:'filgoal', icon:'🥅'},
{url:'https://www.kooora.com/?rss=1', name:'كووورة', cls:'kooora', icon:'🏆'},
{url:'https://news.google.com/rss/search?q=site:beinsports.com+كرة+القدم&hl=ar&gl=EG&ceid=EG:ar', name:'beIN SPORTS', cls:'bein', icon:'📺'}
];

let allNews=[];
for(let src of trustedSources){
try{
let proxy=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}&t=${Date.now()}${Math.random()}`;
let res=await fetch(proxy);
let data=await res.json();
if(data.items && data.items.length>0){
data.items.slice(0,3).forEach(it=>{
let title=it.title;
if(title.length>20){
let type= title.includes('انتقال')||title.includes('صفقة')||title.includes('تعاقد')||title.includes('يضم')?'transfers': title.includes('إصابة')||title.includes('يغيب')||title.includes('غياب')?'injury': title.includes('رسميا')||title.includes('عاجل')?'official':'exclusive';
let typeText= type=='transfers'?'انتقالات': type=='injury'?'إصابة': type=='official'?'رسمي':'حصري';
allNews.push({
title:title,
link:it.link,
pubDate:new Date(it.pubDate),
source:src.name,
sourceCls:src.cls,
icon:src.icon,
type:type,
typeText:typeText
});
}
});
}
}catch(e){ console.log('مصدر فشل',src.name); }
}

// لو فشل كل شي، نجيب من جوجل نيوز بمصادر موثوقة فقط
if(allNews.length<4){
try{
let url=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss/search?q=كرة+القدم+انتقالات+إصابات+beIN+Yallakora+FilGoal&hl=ar&gl=EG&ceid=EG:ar')}&t=${Date.now()}`;
let res=await fetch(url);
let data=await res.json();
data.items.slice(0,6).forEach(it=>{
allNews.push({
title:it.title,
link:it.link,
pubDate:new Date(it.pubDate),
source:'مصدر موثوق',
sourceCls:'yalla',
icon:'✅',
type:'exclusive',
typeText:'حصري'
});
});
}catch(e){}
}

// ترتيب من الأحدث
allNews.sort((a,b)=>b.pubDate-a.pubDate);
allNews=allNews.slice(0,10);

let html=''; let tick='';
allNews.forEach(n=>{
let ago=timeAgo(n.pubDate);
html+=`<div class="news-card">
<div class="news-img">${n.icon}</div>
<div class="news-content">
<div class="news-title">${n.title}</div>
<div class="news-meta">
<span class="meta-source ${n.sourceCls}">${n.source}</span>
<span class="type-badge type-${n.type}">${n.typeText}</span>
<span>⏰ ${ago}</span>
<span style="color:#22c55e">✅ موثوق</span>
</div>
</div>
</div>`;
tick+=` ✅ ${n.source}: ${n.title} (${ago}) • `;
});

document.getElementById('newsBox').innerHTML=html||'<p>جاري التحديث من المصادر الموثوقة...</p>';
document.getElementById('ticker').innerText='🔴 SLOOM TV - مصادر موثوقة: '+tick;
}

loadTrustedNews();
setInterval(loadTrustedNews, 120000); // يحدث كل دقيقتين من المصادر الموثوقة
</script>
</body>
</html>
