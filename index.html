<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOOMTV LIVE | سلوم تيفي - sloomtv</title>
<meta name="description" content="سلوم تيفي sloomtv - v15 بوت واحد">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{margin:0;background:#0a0a0a;color:#fff}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00ff88}
.header b{color:#00ff88;font-size:22px}
.header span{color:#ffeb3b;font-size:12px}
.lang{background:#00ff88;color:#000;border:none;border-radius:24px;padding:8px 18px;font-weight:900;font-size:13px}
.bot-bar{background:#1a1a1a;border:2px solid #00ff88;margin:6px;border-radius:10px;padding:10px;text-align:center}
.bot-bar b{color:#00ff88;font-size:16px}
.bot-bar .leagues{font-size:11px;color:#fff;margin-top:4px;line-height:1.5}
.bot-bar small{color:#00ff88;font-size:11px}
.clock{display:flex;justify-content:space-between;background:#111;padding:8px 12px;font-size:12px;border-bottom:1px solid #222}
.clock .sa{color:#00ff88;font-weight:900}
.clock .om{color:#ffeb3b;font-weight:900}
.league-title{padding:12px 15px;color:#00ff88;font-weight:900;background:#151515;margin-top:10px;display:flex;justify-content:space-between;align-items:center;border-right:4px solid #00ff88;font-size:15px}
.card{background:#222;border-radius:20px;border:1px solid #333;margin:10px;padding:18px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card .team{width:32%;text-align:center;font-size:14px;font-weight:700}
.card .score{width:36%;display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:900}
.card .score .min{color:#00ff88;font-size:22px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;z-index:99;display:none;overflow:auto}
.modal-head{background:#111;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:2px solid #00ff88}
.modal-head button{background:#00ff88;border:none;border-radius:20px;padding:6px 14px;font-weight:900}
.event{padding:12px 15px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.event .time{color:#00ff88;font-weight:900}
</style>
</head>
<body>

<div class="header">
<div><b>SLOOMTV</b> LIVE <span> | سلوم تيفي - sloomtv</span></div>
<button class="lang">عربي / EN</button>
</div>

<!-- بوت واحد فقط v15 -->
<div class="bot-bar">
<b>🤖 BOT v15 - LIVE</b> <small id="botTime">متصل</small>
<div class="leagues">🏴󠁧󠁢󠁥󠁮󠁧󠁿 الإنجليزي | 🇪🇸 الإسباني | 🇮🇹 الإيطالي | 🇫🇷 الفرنسي | 🇩🇪 الألماني | 🇵🇹 البرتغالي | 🇳🇱 الهولندي | 🇧🇷 البرازيلي | 🌏 الآسيوي - روشن</div>
</div>

<div class="clock">
<div id="clockSA">🇸🇦 السعودية</div>
<div id="clockOM">🇴🇲 عمان</div>
</div>

<div id="list"></div>

<div class="modal" id="modal">
<div class="modal-head"><div id="mTitle"></div><button onclick="document.getElementById('modal').style.display='none'">إغلاق X</button></div>
<div id="mContent"></div>
</div>

<script>
const matches=[
{id:1,h:"كوفتنري",a:"سندرلاند",hs:3,as:1,m:"71'",lg:"الإنجليزي الممتاز",events:[{t:"10'",e:"⚽ هدف كوفتنري"},{t:"71'",e:"⚽ هدف كوفتنري"}]},
{id:2,h:"الهلال",a:"النصر",hs:1,as:1,m:"69'",lg:"الآسيوي - روشن",events:[{t:"15'",e:"⚽ الهلال"},{t:"44'",e:"⚽ النصر - رونالدو"}]},
{id:3,h:"برشلونة",a:"ريال مدريد",hs:0,as:1,m:"70'",lg:"الإسباني",events:[{t:"33'",e:"⚽ فينيسيوس"}]},
{id:4,h:"أياكس",a:"آيندهوفن",hs:2,as:2,m:"78'",lg:"الهولندي",events:[{t:"12'",e:"⚽ أياكس"},{t:"78'",e:"⚽ تعادل"}]},
];

function render(){
let html='',last='';
matches.forEach(m=>{
if(last!==m.lg){html+=`<div class="league-title"><span>^</span><span>${m.lg}</span></div>`;last=m.lg;}
html+=`<div class="card" onclick="openM(${m.id})"><div class="team">${m.h}</div><div class="score"><span>${m.hs}</span><span class="min">${m.m}</span><span>${m.as}</span></div><div class="team">${m.a}</div></div>`;
});
document.getElementById('list').innerHTML=html;
}
function openM(id){
const m=matches.find(x=>x.id==id);
document.getElementById('mTitle').innerText=`${m.h} ${m.hs}-${m.as} ${m.a}`;
let ev=m.events.map(e=>`<div class="event"><span>${e.e}</span><span class="time">${e.t}</span></div>`).join('');
document.getElementById('mContent').innerHTML=`<div style="padding:12px;background:#1a1a1a;margin:10px;border-radius:12px"><b style="color:#ffeb3b">📝 ملخص</b><br>${m.lg} - مباشر من سلوم تيفي</div>${ev}<div style="padding:12px;background:#000;margin:10px;border-radius:12px;text-align:center;color:#00ff88">▶️ ملخص الأهداف - beIN Style</div>`;
document.getElementById('modal').style.display='block';
}
render();
function clocks(){
const n=new Date();
document.getElementById('clockSA').textContent='🇸🇦 الرياض ' + n.toLocaleTimeString('ar-EG',{timeZone:'Asia/Riyadh',hour12:true});
document.getElementById('clockOM').textContent='🇴🇲 مسقط ' + n.toLocaleTimeString('ar-EG',{timeZone:'Asia/Muscat',hour12:true});
document.getElementById('botTime').textContent=n.toLocaleTimeString('en-GB',{timeZone:'Asia/Riyadh',hour12:false})+' LIVE';
}
setInterval(clocks,1000);clocks();
</script>
</body>
</html>
