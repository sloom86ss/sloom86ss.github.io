title = "SLOOM365 secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow only ScoreBat public matchview tokens inside the generated highlights archive."
condition = "AND"
paths = ['''(^|/)data/scorebat-highlights\.json$''']
regexTarget = "line"
regexes = ['''(?i)matchview/[^" ]*token=''']
