name: SLOOM365 Auto Repair

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repair.py'
      - '.github/workflows/auto-repair.yml'
      - 'sitemap.xml'
      - 'robots.txt'

permissions:
  contents: write

concurrency:
  group: sloom365-auto-repair
  cancel-in-progress: false

jobs:
  safe-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate repair script
        run: python -m py_compile repair.py
      - name: Run safe automatic repairs
        run: python repair.py
      - name: Verify repository files after repair
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          for page in ("index.html", "sloom360.html", "ai.html"):
              assert Path(page).is_file() and Path(page).stat().st_size > 500, f"Missing or empty page: {page}"
          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("leagues"), dict) and data["leagues"], "No league data"
          root = ET.parse("sitemap.xml").getroot()
          urls = [node.text or "" for node in root.iter() if node.tag.endswith("loc")]
          for url in ("https://sloom86ss.github.io/", "https://sloom86ss.github.io/sloom360.html", "https://sloom86ss.github.io/ai.html"):
              assert url in urls, f"Missing sitemap URL: {url}"
          assert "Sitemap: https://sloom86ss.github.io/sitemap.xml" in Path("robots.txt").read_text(encoding="utf-8")
          print("SLOOM365 repository validation passed")
          PY
      - name: Commit repaired SEO files if needed
        run: |
          git config user.name 'SLOOM365 Auto Repair'
          git config user.email 'sloom365-bot@users.noreply.github.com'
          git add sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Auto-repair SLOOM365 SEO files"
          git pull --rebase origin main
          git push

      - name: Notify phone if auto-repair workflow fails
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not configured; alert skipped."; exit 0; fi
          curl --fail --show-error --silent \
            -H "Title: ⚠️ SLOOM365 Auto Repair failed" \
            -H "Priority: urgent" \
            -H "Tags: warning" \
            -d "تعذر إكمال فحص أو إصلاح مستودع SLOOM365. افتح سجل GitHub Actions لمعرفة الخطأ." \
            "https://ntfy.sh/$NTFY_TOPIC"
