name: Update Sports Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'monitor_state.json'

permissions:
  contents: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m py_compile bot.py
      - name: Run sports data collector
        run: python -u bot.py
      - name: Commit and push updated data
        run: |
          git config user.name 'SLOOM TV Bot'
          git config user.email 'sloom-tv-bot@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Update sports scores, clubs and standings"
          git pull --rebase origin main
          git push
