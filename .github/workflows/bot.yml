name: Update Sports Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'monitor_state.json'

permissions:
  contents: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m py_compile bot.py monitor.py
      - name: Validate SLOOM360 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("sloom360.html").read_text(encoding="utf-8")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/sloom360.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/sloom360.js
          node --check --input-type=module < api/chat.js
          node --check --input-type=module < api/match.js
      - name: Run sports data collector
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python -u bot.py
      - name: Commit and push updated data
        run: |
          git config user.name 'SLOOM TV Bot'
          git config user.email 'sloom-tv-bot@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Update football scores, clubs and standings"
          git fetch origin main
          git reset --soft origin/main
          git add data.json
          git diff --cached --quiet && echo "No data changes after sync" && exit 0
          git commit -m "Publish latest football data"
          git push origin main
