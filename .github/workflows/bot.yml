name: Update Sports Data

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'monitor_state.json'
      - 'eye-of-pitch-365/data/**'

permissions:
  contents: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m py_compile bot.py backup_collector.py monitor.py repair.py smart_responder.py sportscore_probe.py scripts/refresh_data.py scripts/generate_seo_pages.py
      - name: Validate SLOOM360 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in ("index.html", "sloom360.html", "ai.html"):
              source = Path(page).read_text(encoding="utf-8")
              script = source.split("<script>", 1)[1].split("</script>", 1)[0]
              Path("/tmp/" + page + ".js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/sloom360.html.js
          node --check /tmp/ai.html.js
          node --check --input-type=module < api/chat.js
          node --check --input-type=module < api/match.js
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          json.loads(Path("data.json").read_text(encoding="utf-8"))
          ET.parse("sitemap.xml")
          assert "Sitemap: https://sloom86ss.github.io/sitemap.xml" in Path("robots.txt").read_text(encoding="utf-8")
          print("JSON, sitemap and robots checks passed")
          PY
      - name: Run primary ESPN sports data collector
        id: primary_collector
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python -u bot.py
      - name: Verify SportScore backup source using repository secret
        env:
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        run: python -u sportscore_probe.py
      - name: Run independent keyless backup for stale leagues
        if: always() && steps.primary_collector.outcome != 'skipped'
        run: python -u backup_collector.py
      - name: Diagnose stale feeds and retry once when needed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SMART_MAX_DATA_AGE_MINUTES: "20"
          SMART_MAX_LEAGUE_AGE_MINUTES: "20"
        run: python -u smart_responder.py
      - name: Commit and push updated data
        run: |
          git config user.name 'SLOOM TV Bot'
          git config user.email 'sloom-tv-bot@users.noreply.github.com'
          cp data.json /tmp/sloom365-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sloom365-data.json data.json
          python -u scripts/generate_seo_pages.py
          git add data.json seo sitemap.xml
          git diff --cached --quiet && echo "No football data changes" && exit 0
          git commit -m "Update football scores, clubs and standings"
          git push origin main
