name: SLOOM TV Notification Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not configured."; exit 1; fi
          curl --fail --show-error --silent \
            -H "Title: اختبار تنبيهات SLOOM TV" \
            -H "Priority: urgent" \
            -H "Tags: warning" \
            -d "هذا إشعار تجريبي. إذا وصل إلى هاتفك، فتنبيهات SLOOM TV تعمل." \
            "https://ntfy.sh/$NTFY_TOPIC"
