name: Monitor SLOOM360 site

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-sloom360
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check website and football data
        env:
          SLOOM_SITE_URL: https://sloom86ss.github.io
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          MAX_DATA_AGE_MINUTES: "100"
        run: |
          set +e
          python -u monitor.py
          STATUS=$?
          echo "MONITOR_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0
      - name: Save alert state when it changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          if git diff --cached --quiet; then
            echo "No health-state transition to save."
            exit 0
          fi
          git commit -m "Update SLOOM360 monitor state"
          git push origin main
      - name: Report health-check result
        if: always()
        run: |
          if [ "${MONITOR_STATUS:-0}" != "0" ]; then
            echo "SLOOM360 health check detected a problem."
            exit 1
          fi
