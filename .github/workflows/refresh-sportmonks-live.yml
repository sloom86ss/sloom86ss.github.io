name: Refresh SLOOM365 live scores (Sportmonks)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sloom365-sportmonks-live-scores
  cancel-in-progress: true

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whether Sportmonks is configured
        id: sportmonks_key
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          if [ -n "$SPORTMONKS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SPORTMONKS_TOKEN is not configured; existing ESPN/GOAL sources remain untouched."
          fi
      - name: Refresh live scores from Sportmonks
        if: steps.sportmonks_key.outputs.configured == 'true'
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python scripts/refresh_sportmonks_live.py
      - name: Commit live score updates
        if: steps.sportmonks_key.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data.json; then
            echo "No live score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh live football scores from Sportmonks"
          git push
