name: Refresh SLOOM365 live scores (GOAL API)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sloom365-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whether GOAL API is configured
        id: goal_key
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          if [ -n "$GOAL_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOAL_API_KEY is not configured; ESPN remains the active source."
          fi
      - name: Refresh existing live fixtures from GOAL API
        if: steps.goal_key.outputs.configured == 'true'
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python scripts/refresh_goal_live.py
      - name: Commit live score updates
        if: steps.goal_key.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data.json; then
            echo "No live score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh live football scores from GOAL API"
          git push
