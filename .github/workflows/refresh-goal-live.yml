name: Refresh SLOOM365 live scores (GOAL API)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sloom365-goal-live-scores
  cancel-in-progress: true

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh existing live fixtures from GOAL API
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python scripts/refresh_goal_live.py
      - name: Commit live score updates
        run: |
          if git diff --quiet -- data.json; then
            echo "No live score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh live football scores from GOAL API"
          git push
