name: عين الملعب 365 - تحديث المباريات المباشرة

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eye-pitch-live-data
  cancel-in-progress: false

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch live fixtures securely
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          key = os.environ.get('API_FOOTBALL_KEY', '').strip()
          if not key:
              print('Missing repository secret: API_FOOTBALL_KEY')
              sys.exit(1)
          url = 'https://v3.football.api-sports.io/fixtures?live=all&timezone=Asia%2FMuscat'
          req = Request(url, headers={'x-apisports-key': key, 'Accept': 'application/json'})
          try:
              with urlopen(req, timeout=25) as response:
                  status = response.status
                  body = response.read()
                  remaining = response.headers.get('x-ratelimit-requests-remaining')
          except HTTPError as exc:
              print(f'API request failed with HTTP {exc.code}')
              sys.exit(1)
          except URLError as exc:
              print(f'Network error: {exc.reason}')
              sys.exit(1)
          if status != 200:
              print(f'Unexpected API status: {status}')
              sys.exit(1)
          try:
              payload = json.loads(body.decode('utf-8'))
          except Exception:
              print('API returned invalid JSON')
              sys.exit(1)
          errors = payload.get('errors') or {}
          if errors:
              print('API reported an error; preserving last good data.')
              print(json.dumps(errors, ensure_ascii=False)[:1000])
              sys.exit(1)
          result = payload.get('response')
          if not isinstance(result, list):
              print('API response did not contain a fixtures list.')
              sys.exit(1)
          data = {'source':'API-Football','fetched_at_utc':datetime.now(timezone.utc).isoformat(),'timezone':'Asia/Muscat','results':payload.get('results',len(result)),'requests_remaining':remaining,'response':result}
          target = Path('eye-of-pitch-365/data/live.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print(f'Saved {len(result)} live fixtures.')
          PY
      - name: Commit updated live data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eye-of-pitch-365/data/live.json
          if git diff --cached --quiet; then echo 'No live data changes.'; exit 0; fi
          git commit -m 'Update Eye of Pitch 365 live fixtures'
          git push
