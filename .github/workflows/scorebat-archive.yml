name: Update ScoreBat football highlights archive
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scorebat-archive.yml"
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
concurrency:
  group: scorebat-highlights-archive
  cancel-in-progress: false
jobs:
  update-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch ScoreBat free feed and merge archive
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          feed_url = "https://www.scorebat.com/video-api/v3/free-feed/?token=NDE4MDI0XzE3OTQxNDUwODNfNzVlMzZiY2U1YmYwNDA2ZDRkYjg1OTFlYTIxMTFiNGNhM2QxZWI5Ng%3D%3D"
          request = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "SLOOM-KORA-365/1.0", "Accept": "application/json"}
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              data = json.loads(response.read().decode("utf-8"))

          incoming = data.get("response") if isinstance(data, dict) else None
          if not isinstance(incoming, list):
              raise RuntimeError("ScoreBat response format was not a response list")

          path = Path("data/scorebat-highlights.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              old = json.loads(path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              old = {"response": []}

          merged = {}
          for item in old.get("response", []):
              if isinstance(item, dict):
                  key = str(item.get("matchviewUrl") or item.get("source_url") or item.get("video_id") or (item.get("title", "") + "|" + str(item.get("date", ""))))
                  merged[key] = item

          added = 0
          for match in incoming:
              if not isinstance(match, dict):
                  continue
              title = str(match.get("title") or "").strip()
              videos = match.get("videos") or []
              videos = [
                  {"title": str(video.get("title") or "ملخص المباراة"),
                   "embed": str(video.get("embed") or "")}
                  for video in videos
                  if isinstance(video, dict) and video.get("embed")
              ]
              if not title or not videos:
                  continue

              competition = match.get("competition")
              if isinstance(competition, dict):
                  competition = competition.get("name") or ""
              competition = str(competition or "كرة القدم")
              date = str(match.get("date") or "")
              source_url = str(match.get("matchviewUrl") or match.get("url") or "")
              key = str(match.get("matchviewUrl") or source_url or (title + "|" + date))
              record = {
                  "video_id": key,
                  "title": title,
                  "competition": competition,
                  "date": date,
                  "videos": videos,
                  "source": "ScoreBat",
                  "source_url": source_url
              }
              if key not in merged:
                  added += 1
              merged[key] = record

          # Keep the newest 200 matches so the mobile archive stays lightweight.
          result = sorted(
              merged.values(),
              key=lambda item: str(item.get("date", "")),
              reverse=True
          )[:200]
          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "provider": "ScoreBat Free Feed",
              "response": result
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"ScoreBat returned {len(incoming)} entries; {added} new matches merged; {len(result)} total archived.")
          PY
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scorebat-highlights.json
          git diff --cached --quiet || git commit -m "Update ScoreBat highlights archive"
          git push
