name: Update official Premier League highlights archive
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scorebat-archive.yml"
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
concurrency:
  group: scorebat-highlights-archive
  cancel-in-progress: false
jobs:
  update-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch official Premier League YouTube RSS
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          channel_id = "UCG5qGWdu8nIRZqJ_GgDwQ-w"
          feed_url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          req = urllib.request.Request(feed_url, headers={"User-Agent": "SLOOM-KORA-365/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
          }
          path = Path("data/scorebat-highlights.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              old = json.loads(path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              old = {"response": []}

          merged = {}
          for item in old.get("response", []):
              if isinstance(item, dict):
                  key = str(item.get("video_id") or item.get("title", "") + "|" + str(item.get("date", "")))
                  merged[key] = item

          accepted = re.compile(r"highlight|goal|goals|matchday|best saves|best goals|extended", re.I)
          received = 0
          for entry in root.findall("atom:entry", ns):
              video_id = (entry.findtext("yt:videoId", default="", namespaces=ns) or "").strip()
              title = (entry.findtext("atom:title", default="", namespaces=ns) or "").strip()
              published = (entry.findtext("atom:published", default="", namespaces=ns) or "").strip()
              if not video_id or not title or not accepted.search(title):
                  continue
              received += 1
              merged[video_id] = {
                  "video_id": video_id,
                  "title": title,
                  "competition": "الدوري الإنجليزي الممتاز",
                  "date": published,
                  "videos": [{
                      "title": "ملخص المباراة الرسمي",
                      "embed": f"https://www.youtube.com/embed/{video_id}"
                  }],
                  "source": "قناة الدوري الإنجليزي الرسمية على YouTube",
                  "source_url": f"https://www.youtube.com/watch?v={video_id}"
              }

          result = sorted(
              merged.values(),
              key=lambda item: str(item.get("date", "")),
              reverse=True
          )
          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "provider": "Official Premier League YouTube RSS",
              "response": result
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Archived {received} new official uploads; {len(result)} videos retained.")
          PY
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scorebat-highlights.json
          git diff --cached --quiet || git commit -m "Update official Premier League highlights archive"
          git push
