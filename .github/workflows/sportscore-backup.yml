name: SLOOM365 SportScore Backup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sportscore-backup
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate collector
        run: python -m py_compile sportscore_backup.py

      - name: Fetch SportScore snapshot
        run: python -u sportscore_backup.py

      - name: Commit separate backup snapshot
        run: |
          git config user.name 'SLOOM365 SportScore Backup'
          git config user.email 'sloom-tv-bot@users.noreply.github.com'
          git add sportscore_backup.json
          git diff --cached --quiet && echo "No SportScore snapshot changes" && exit 0
          git commit -m "Refresh SportScore backup snapshot"
          git push origin HEAD:main
