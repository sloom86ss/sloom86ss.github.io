name: Refresh SLOOM360 football data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sloom360-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh scores, tables and football news
        run: python scripts/refresh_data.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No football data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh football scores and news"
          git push
