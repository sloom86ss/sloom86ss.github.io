name: SLOOM365 automatic live score refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sloom365-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh ESPN fixtures and scores
        run: python scripts/refresh_live_scores.py
      - name: Commit verified score updates
        run: |
          if git diff --quiet -- data.json; then
            echo "No football data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh live football scores automatically"
          git push
