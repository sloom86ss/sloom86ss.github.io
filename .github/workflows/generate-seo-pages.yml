name: Generate SLOOM365 SEO pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sloom365-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Arabic league and match pages
        run: python scripts/generate_seo_pages.py
      - name: Commit generated SEO pages and sitemap safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo sitemap.xml
          if git diff --cached --quiet; then
            echo "SEO pages are already current."
            exit 0
          fi
          git commit -m "Generate Arabic SEO pages for leagues and matches"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/generate_seo_pages.py
              git add seo sitemap.xml
              if git diff --cached --quiet; then
                echo "SEO pages are already current after syncing main."
                exit 0
              fi
              git commit -m "Generate Arabic SEO pages for leagues and matches"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; syncing with latest main."
          done
          echo "Could not push SEO pages after 3 attempts."
          exit 1
