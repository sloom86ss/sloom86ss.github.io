<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#281052">
<title>كاندي كروش 365</title>
<style>
:root{--gold:#ffe49a;--pink:#ff6cbd;--purple:#5523a5;--deep:#170b37}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 8%,#8c42d7 0,#482080 35%,#1b0c3b 78%,#100722 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#ffd9ff 1px,transparent 1px);background-size:53px 53px,83px 83px;background-position:0 0,24px 36px}
.wrap{position:relative;z-index:1;width:min(100%,560px);margin:auto;padding:10px 12px 22px}
header{text-align:center;padding:4px 0 8px}.logo{display:inline-flex;align-items:center;gap:9px;padding:6px 18px;border:2px solid #ffe9a0;border-radius:30px;background:linear-gradient(180deg,#7e3ac7,#39116d);box-shadow:0 4px 0 #21083f,0 0 22px #ffb3f577,inset 0 2px 5px #fff7}.logo .candy{font-size:29px;filter:drop-shadow(0 3px 2px #260943)}h1{font-size:clamp(25px,7vw,36px);margin:0;color:#fff2b5;text-shadow:0 3px 0 #8d4a17,0 5px 10px #230b49;letter-spacing:.3px}.tag{font-size:10px;letter-spacing:4px;color:#ffd6ff;font-weight:800}
.panel{border:2px solid #f9d889;border-radius:20px;background:linear-gradient(145deg,#542394eF,#291052f2);box-shadow:0 8px 0 #18092f,0 12px 25px #08031688,inset 0 2px 4px #fff4;margin-bottom:10px;padding:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border-radius:14px;text-align:center;padding:5px 3px;background:linear-gradient(180deg,#35105f,#210b43);border:1px solid #d9a9ff;box-shadow:inset 0 2px 4px #fff2}.stat small{display:block;color:#f7cfff;font-size:10px}.stat strong{font-size:22px;color:#fff2a7;text-shadow:0 2px 3px #160526}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#ffe9b5}.goalrow b{font-size:15px;color:#fff}.progress{height:10px;border-radius:20px;background:#17072d;border:1px solid #bd8ee9;overflow:hidden;margin-top:7px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff67b8,#ffe26c);border-radius:20px;transition:width .3s}
.board-shell{padding:8px;border-radius:23px;background:linear-gradient(145deg,#ffdc88,#a65be2 25%,#3c176e 75%,#ffce77);box-shadow:0 8px 0 #1a0838,0 14px 28px #09031caa,inset 0 2px 5px #fff}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:7px;border-radius:16px;background:linear-gradient(145deg,#28104e,#16072e);border:2px solid #e6aaff;touch-action:pan-y;user-select:none}
.cell{aspect-ratio:1;min-width:0;border-radius:10px;background:linear-gradient(145deg,#482174,#281047);box-shadow:inset 0 2px 4px #0d0324,inset 0 -1px 2px #a36dd1;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .12s,filter .12s}.cell.selected{outline:3px solid #fff3a1;outline-offset:-2px;filter:brightness(1.25);transform:scale(.94)}.cell.pop{animation:pop .22s ease-in forwards}.gem{width:82%;height:82%;position:relative;display:grid;place-items:center;border-radius:32% 32% 38% 38%;transform:rotate(45deg);border:1px solid #ffffff9c;box-shadow:inset 3px 4px 5px #fff9,inset -4px -6px 7px #0004,0 3px 5px #09021b99;filter:drop-shadow(0 2px 1px #0c0325)}.gem:before{content:"";position:absolute;width:38%;height:18%;border-radius:50%;background:#ffffffa8;top:12%;left:13%;filter:blur(1px)}.gem:after{content:"";position:absolute;inset:8%;border-radius:28%;border:1px solid #ffffff45}.gem span{transform:rotate(-45deg);font-size:clamp(13px,4vw,23px);text-shadow:0 2px 2px #0004;filter:drop-shadow(0 1px 1px #fff7)}
.g0{background:linear-gradient(140deg,#ff9bd0,#ef2589 55%,#9e075c)}.g1{background:linear-gradient(140deg,#a5edff,#24a9f2 55%,#1451bc)}.g2{background:linear-gradient(140deg,#fff18a,#ffbd25 55%,#dc5b05)}.g3{background:linear-gradient(140deg,#c9ff9b,#61d83c 55%,#168b39)}.g4{background:linear-gradient(140deg,#e7b4ff,#a64be9 55%,#5a159d)}.g5{background:linear-gradient(140deg,#ffb1a0,#fa5549 55%,#ae142e)}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #fff0b0;border-radius:25px;padding:10px 17px;font-size:13px;font-weight:900;color:#41134d;background:linear-gradient(180deg,#fff3a6,#ffb83c);box-shadow:0 4px 0 #9b4b17,0 6px 10px #13052677;cursor:pointer}.btn.secondary{background:linear-gradient(180deg,#f7d6ff,#ba76ed);box-shadow:0 4px 0 #56217c;color:#32104d}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b4b17}.help{text-align:center;color:#f3d9ff;font-size:11px;line-height:1.6;margin:9px 4px}
.overlay{position:fixed;inset:0;z-index:5;background:#10051ddd;display:none;place-items:center;padding:20px}.dialog{width:min(100%,350px);text-align:center;padding:24px 18px;border:3px solid #ffe39a;border-radius:24px;background:linear-gradient(145deg,#7736b5,#28104f);box-shadow:0 12px 40px #000b,inset 0 2px 5px #fff5}.dialog h2{color:#fff1a8;margin:0 0 8px;font-size:27px}.dialog p{color:#ffe5ff;font-size:14px}.dialog .btn{margin-top:8px}
@keyframes pop{to{transform:scale(.15) rotate(100deg);opacity:0}}
@media(max-width:380px){.wrap{padding:7px 8px}.board{gap:3px;padding:5px}.cell{border-radius:7px}.gem{width:84%;height:84%}.panel{padding:8px}.stat strong{font-size:19px}}

/* Full-screen realistic gameplay layout */
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 45%,#45206d 0%,#1b0b32 58%,#080510 100%);overscroll-behavior:none}
body:before{opacity:.12}
.wrap{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;margin:0;padding:0;display:grid;place-items:center;overflow:hidden}
header,.panel,.actions,.help{display:none!important}
.board-shell{width:min(100vw,100dvh);height:min(100vw,100dvh);padding:clamp(5px,1.5vw,12px);margin:0;border-radius:clamp(14px,3vw,26px);box-shadow:0 0 35px #000b,inset 0 2px 8px #fff9}
.board{width:100%;height:100%;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(2px,.65vw,6px);padding:clamp(4px,1vw,9px);border-radius:clamp(10px,2vw,18px);touch-action:none}
.cell{width:100%;height:100%;aspect-ratio:auto;border-radius:24%;background:linear-gradient(145deg,#291344,#160824);box-shadow:inset 0 3px 7px #08020f,inset 0 -1px 2px #8c5ab0}
.gem{width:84%;height:84%;border:1px solid #ffffffa8;border-radius:38%;transform:rotate(0deg);box-shadow:inset 3px 4px 7px #fff9,inset -5px -7px 9px #0006,0 5px 7px #05010d99;filter:drop-shadow(0 3px 2px #08020b);overflow:hidden}
.gem:before{width:54%;height:23%;top:9%;left:12%;background:linear-gradient(180deg,#ffffffed,#ffffff35);filter:blur(1.2px);transform:rotate(-24deg)}
.gem:after{inset:7%;border-radius:32%;border:1px solid #ffffff55;box-shadow:inset 0 0 8px #ffffff35}
.gem span{transform:none;font-size:clamp(11px,3.3vw,22px);font-weight:900;text-shadow:0 2px 3px #0008;filter:drop-shadow(0 1px 1px #fff8)}
.g0{background:radial-gradient(ellipse at 30% 20%,#ffd8ee 0%,#ff7fc5 22%,#f52a91 58%,#8e064e 100%)}
.g1{background:radial-gradient(ellipse at 30% 20%,#e2fbff 0%,#82dcff 22%,#229be9 58%,#073f99 100%)}
.g2{background:radial-gradient(ellipse at 30% 20%,#fffbd0 0%,#ffe77c 22%,#ffb21e 58%,#b84a00 100%)}
.g3{background:radial-gradient(ellipse at 30% 20%,#edffd4 0%,#b8ff85 22%,#5bcf39 58%,#146c27 100%)}
.g4{background:radial-gradient(ellipse at 30% 20%,#f9e5ff 0%,#d8a1ff 22%,#9a4ce0 58%,#451079 100%)}
.g5{background:radial-gradient(ellipse at 30% 20%,#ffe1d8 0%,#ff9a83 22%,#f34a43 58%,#941024 100%)}
.cell.selected .gem{transform:scale(.88);filter:brightness(1.35) drop-shadow(0 0 8px #fff4a8)}
.cell.pop .gem{animation:pop .24s ease-in forwards}
@keyframes pop{to{transform:scale(.05) rotate(130deg);opacity:0;filter:brightness(2)}}
.overlay{background:#08030eeF;backdrop-filter:blur(9px)}
.dialog{box-shadow:0 14px 45px #000d,inset 0 2px 8px #fff5}
@media(orientation:landscape){.board-shell{width:min(100dvh,100vw);height:min(100dvh,100vw)}}

#resourceLoader{position:fixed;inset:0;z-index:20;display:grid;align-content:center;justify-items:center;gap:14px;background:radial-gradient(ellipse at center,#57258a,#160923 75%);color:#fff;text-align:center;transition:opacity .35s}.loaderCandy{font-size:76px;filter:drop-shadow(0 8px 14px #0009);animation:loaderFloat 1s ease-in-out infinite alternate}.loaderTitle{font-size:clamp(25px,7vw,38px);font-weight:1000;color:#ffe9a3;text-shadow:0 3px 0 #873e16,0 6px 15px #0009}.loaderText{font-size:15px;color:#f6dcff;font-weight:700}.loaderTrack{width:min(72vw,300px);height:9px;border-radius:20px;background:#ffffff25;overflow:hidden;border:1px solid #ffffff55}.loaderTrack i{display:block;width:0;height:100%;border-radius:20px;background:linear-gradient(90deg,#ff65bd,#ffe68a);transition:width .2s}#resourceLoader.done{opacity:0;pointer-events:none}@keyframes loaderFloat{to{transform:translateY(-9px) rotate(8deg)}}.board,.cell{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.board{touch-action:none}.candy-art{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 3px #08020c99)}.cell.selected .candy-art{transform:scale(.88);filter:brightness(1.25) drop-shadow(0 0 9px #fff2a2)}
</style></head>
<body><div id="resourceLoader"><div class="loaderCandy">🍬</div><div class="loaderTitle">كاندي كروش 365</div><div class="loaderText">جاري تحميل الموارد...</div><div class="loaderTrack"><i id="loadProgress"></i></div></div><div id="gameCanvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:1"></div><main class="wrap" style="pointer-events:none"><div style="pointer-events:auto;display:none"></div>
<header><div class="logo"><span class="candy">🍭</span><div><h1>كاندي كروش 365</h1><div class="tag">CANDY CRUSH 365</div></div><span class="candy">🍬</span></div></header>
<section class="panel stats"><div class="stat"><small>⭐ النقاط</small><strong id="score">0</strong></div><div class="stat"><small>🎯 الهدف</small><strong id="target">1200</strong></div><div class="stat"><small>👣 الحركات</small><strong id="moves">25</strong></div></section>
<section class="panel"><div class="goalrow"><span>🍬 اجمع الحلوى وسجّل أعلى نتيجة!</span><b id="level">المرحلة 1</b></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="board-shell"><div class="board" id="board" aria-label="لوحة الحلوى"></div></section>
<div class="actions"><button class="btn" id="restart">↻ إعادة المرحلة</button><button class="btn secondary" id="hint">✨ تلميح</button></div>
<p class="help">بدّل مكان حبتين متجاورتين لتكوين صف أو عمود من 3 حبات متشابهة أو أكثر. اسحب بإصبعك أو المس الحبتين بالترتيب.</p>
</main>
<div class="overlay" id="overlay"><div class="dialog"><div style="font-size:48px" id="resultIcon">🏆</div><h2 id="resultTitle">أحسنت!</h2><p id="resultText"></p><button class="btn" id="next">متابعة اللعب</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
(()=> {
const N=8,TYPES=6, colors=[["#ffd8ef","#ff5cae","#a90059"],["#e5fbff","#42c7ff","#0752aa"],["#fff7bb","#ffc52e","#a84400"],["#edffd6","#82e94a","#176b25"],["#f8e1ff","#bd75f2","#57118e"],["#ffe2dc","#ff6656","#9c1029"]];
const $=id=>document.getElementById(id), loader=$("resourceLoader"), bar=$("loadProgress");
let score=0,moves=25,level=1,game,sceneRef,grid=[],selected=null,busy=false,cell=0,offsetX=0,offsetY=0,tiles=[];
const target=()=>1000+level*200, rand=()=>Math.floor(Math.random()*TYPES);
function svgCandy(p){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><radialGradient id="g" cx="28%" cy="18%" r="85%"><stop stop-color="'+p[0]+'"/><stop offset=".3" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[2]+'"/></radialGradient><linearGradient id="s" x2=".2" y2="1"><stop stop-color="white" stop-opacity=".95"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient></defs><path d="M64 5 C77 14 96 9 112 27 C105 45 124 62 112 81 C100 98 103 113 81 119 C62 111 45 126 27 110 C23 90 5 79 13 59 C21 39 14 23 36 15 C47 17 55 8 64 5Z" fill="url(#g)" stroke="#fff" stroke-opacity=".78" stroke-width="3"/><path d="M28 37 Q43 14 75 22 Q48 25 34 48Z" fill="url(#s)"/><path d="M23 68 Q27 103 62 108" fill="none" stroke="white" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/></svg>'}
const assets=colors.map((p,i)=>({key:"candy"+i,data:"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgCandy(p))}));
function ui(){ $("score").textContent=score.toLocaleString("en-US");$("moves").textContent=moves;$("level").textContent="المرحلة "+level;$("target").textContent=target().toLocaleString("en-US");$("bar").style.width=Math.min(100,score/target()*100)+"%"}
function matches(){const found=new Set();for(let r=0;r<N;r++){let c=0;while(c<N){let e=c+1;while(e<N&&grid[r][e]===grid[r][c])e++;if(e-c>=3)for(let x=c;x<e;x++)found.add(r+","+x);c=e}}for(let c=0;c<N;c++){let r=0;while(r<N){let e=r+1;while(e<N&&grid[e][c]===grid[r][c])e++;if(e-r>=3)for(let x=r;x<e;x++)found.add(x+","+c);r=e}}return [...found].map(s=>s.split(",").map(Number))}
function makeGrid(){grid=Array.from({length:N},()=>Array(N).fill(0));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v;do{v=rand()}while((c>1&&grid[r][c-1]===v&&grid[r][c-2]===v)||(r>1&&grid[r-1][c]===v&&grid[r-2][c]===v));grid[r][c]=v}}
function show(icon,title,msg,button){$("resultIcon").textContent=icon;$("resultTitle").textContent=title;$("resultText").textContent=msg;$("next").textContent=button;$("overlay").style.display="grid"}
function finish(){if(score>=target())show("🏆","رائع! أكملت المرحلة","وصلت إلى الهدف. نتيجتك "+score.toLocaleString("en-US")+" نقطة.","التالي");else if(moves<=0)show("💗","انتهت الحركات","حاول مرة أخرى لتحقق الهدف.","إعادة المحاولة")}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function coords(r,c){return {x:offsetX+c*cell+cell/2,y:offsetY+r*cell+cell/2}}
function layout(){const w=game.scale.width,h=game.scale.height;cell=Math.floor(Math.min(w,h)*.94/N);offsetX=(w-cell*N)/2;offsetY=(h-cell*N)/2;return {w,h}}
function drawBoard(){const {w,h}=layout();sceneRef.children.removeAll();tiles=[];const bg=sceneRef.add.graphics();bg.fillGradientStyle(0x291344,0x291344,0x160824,0x160824,1);bg.fillRoundedRect(offsetX-7,offsetY-7,cell*N+14,cell*N+14,18);bg.lineStyle(2,0xe6aaff,.9);bg.strokeRoundedRect(offsetX-7,offsetY-7,cell*N+14,cell*N+14,18);
for(let r=0;r<N;r++){tiles[r]=[];for(let c=0;c<N;c++){const p=coords(r,c);const box=sceneRef.add.graphics();box.fillStyle(0x32194f,1);box.fillRoundedRect(p.x-cell*.47,p.y-cell*.47,cell*.94,cell*.94,Math.max(5,cell*.15));const img=sceneRef.add.image(p.x,p.y,"candy"+grid[r][c]).setDisplaySize(cell*.82,cell*.82).setInteractive({useHandCursor:false});img.r=r;img.c=c;tiles[r][c]=img;}}if(selected)highlight()}
function highlight(){if(!selected)return;const p=coords(selected.r,selected.c);const g=sceneRef.add.graphics();g.lineStyle(4,0xfff2a0,1);g.strokeRoundedRect(p.x-cell*.48,p.y-cell*.48,cell*.96,cell*.96,Math.max(6,cell*.16))}
function pick(r,c){if(!selected){selected={r,c};drawBoard();return}const a=selected,b={r,c};if(a.r===r&&a.c===c){selected=null;drawBoard();return}if(adjacent(a,b)){selected=null;doMove(a,b)}else{selected=b;drawBoard()}}
function tweenSwap(a,b,duration=150){return new Promise(resolve=>{const A=tiles[a.r][a.c],B=tiles[b.r][b.c],pa=coords(a.r,a.c),pb=coords(b.r,b.c);sceneRef.tweens.add({targets:A,x:pb.x,y:pb.y,duration,ease:"Sine.easeInOut"});sceneRef.tweens.add({targets:B,x:pa.x,y:pa.y,duration,ease:"Sine.easeInOut",onComplete:resolve});[grid[a.r][a.c],grid[b.r][b.c]]=[grid[b.r][b.c],grid[a.r][a.c]];[tiles[a.r][a.c],tiles[b.r][b.c]]=[B,A];A.r=b.r;A.c=b.c;B.r=a.r;B.c=a.c})}
const delay=ms=>new Promise(ok=>setTimeout(ok,ms));
async function cascade(){let chain=0;while(true){const m=matches();if(!m.length)break;chain++;score+=m.length*60*chain;for(const [r,c] of m){const t=tiles[r][c];await new Promise(resolve=>sceneRef.tweens.add({targets:t,scale:0,alpha:0,duration:160,ease:"Back.easeIn",onComplete:resolve}));t.destroy();tiles[r][c]=null;grid[r][c]=-1}
for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--)if(grid[r][c]!==-1)vals.push(grid[r][c]);for(let r=N-1;r>=0;r--)grid[r][c]=vals[N-1-r]??rand()}
drawBoard();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=tiles[r][c];if(t.y<coords(r,c).y-1){t.y=offsetY-cell;sceneRef.tweens.add({targets:t,y:coords(r,c).y,duration:230,ease:"Bounce.easeOut"})}}await delay(250)}ui()}
async function doMove(a,b){if(busy)return;busy=true;await tweenSwap(a,b);if(!matches().length){await tweenSwap(a,b,130);drawBoard();busy=false;return}moves--;await cascade();busy=false;finish();ui()}
function reset(){score=0;moves=25;selected=null;busy=false;makeGrid();drawBoard();ui();$("overlay").style.display="none"}
class GameScene extends Phaser.Scene{constructor(){super("CandyScene")}preload(){this.load.on("progress",v=>bar.style.width=Math.round(v*100)+"%");assets.forEach(a=>this.load.image(a.key,a.data));}create(){sceneRef=this;let down=null;this.input.on("pointerdown",p=>{if(busy)return;const c=Math.floor((p.x-offsetX)/cell),r=Math.floor((p.y-offsetY)/cell);if(r>=0&&r<N&&c>=0&&c<N)down={r,c,x:p.x,y:p.y};});this.input.on("pointerup",p=>{if(!down||busy)return;const a=down;down=null;const c=Math.floor((p.x-offsetX)/cell),r=Math.floor((p.y-offsetY)/cell);if(r<0||r>=N||c<0||c>=N)return;const b={r,c};if(Math.hypot(p.x-a.x,p.y-a.y)>12){if(adjacent(a,b))doMove(a,b)}else pick(a.r,a.c)});makeGrid();drawBoard();ui();this.scale.on("resize",()=>drawBoard());loader.classList.add("done");setTimeout(()=>loader.remove(),400);}}
function boot(){if(!window.Phaser){$("resourceLoader").querySelector(".loaderText").textContent="تعذر تحميل محرك اللعبة. تحقق من الاتصال ثم أعد فتح الصفحة.";return}game=new Phaser.Game({type:Phaser.AUTO,parent:"gameCanvas",width:window.innerWidth,height:window.innerHeight,backgroundColor:"#10071d",transparent:false,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true,roundPixels:true},scene:[GameScene]});}
$("restart").onclick=reset;$("hint").onclick=()=>{if(busy)return;let found=null;for(let r=0;r<N&&!found;r++)for(let c=0;c<N&&!found;c++)for(const [dr,dc] of [[0,1],[1,0]]){const rr=r+dr,cc=c+dc;if(rr<N&&cc<N){[grid[r][c],grid[rr][cc]]=[grid[rr][cc],grid[r][c]];if(matches().length)found={r,c};[grid[r][c],grid[rr][cc]]=[grid[rr][cc],grid[r][c]]}}if(found){selected=found;drawBoard()}};
$("next").onclick=()=>{if(score>=target())level++;reset()};
const phaserScript=document.querySelector('script[src*="phaser"]');if(phaserScript){phaserScript.onload=boot;phaserScript.onerror=()=>{$("resourceLoader").querySelector(".loaderText").textContent="تعذر تحميل المحرك. أعد المحاولة عند توفر الإنترنت."}}else boot();
})();
</script></body></html>
