<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014"><title>القواعد الإنجليزية من الصفر | SMART EDU 365</title>
<style>
:root{--gold:#f0cf83;--line:#55452c;--muted:#c8c0b2;--panel:#191820}
*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(ellipse at top,#302416,#0d0d12 60%);color:#faf5e9;font-family:Tahoma,Arial,sans-serif;line-height:1.85}.wrap{max-width:800px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.gold{color:var(--gold)}a{color:var(--gold)}.muted{color:var(--muted);font-size:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.progress{height:8px;background:#37333b;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#bb8735,#ffe4a0)}.sample{background:#24212a;border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.en{direction:ltr;text-align:center;font-size:25px;font-weight:bold}.ar{text-align:center;color:var(--muted)}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:linear-gradient(135deg,#ffe5a0,#c18c35);color:#241907}.secondary{background:#302b24;color:#fff;border:1px solid #625239}.secondary:disabled{opacity:.4}.options{display:grid;gap:9px;margin:12px 0}.options button{text-align:center;background:#111117;color:#fff;border:1px solid #49414a}.options button:hover{border-color:var(--gold)}.notice{background:#241e13;border:1px solid #715a31;border-radius:12px;padding:12px;color:#f2dfb5;font-size:14px}.hidden{display:none!important}.tip{border-right:3px solid var(--gold);padding:8px 12px;background:#211d18;border-radius:8px}
</style></head>
<body><main class="wrap">
<div class="top"><div><h1 class="gold">SMART EDU 365</h1><h2>القواعد الإنجليزية من الصفر</h2></div><a href="index.html">الرئيسية</a></div>
<p class="muted">نتعلم قاعدة واحدة في كل مرة، بشرح عربي وأمثلة قصيرة. لا تحتاج إلى معرفة سابقة.</p>
<section class="panel">
<div style="display:flex;justify-content:space-between;gap:8px"><b id="lessonTitle">الدرس الأول</b><span class="muted" id="counter">1 / 5</span></div>
<div class="progress"><span id="bar"></span></div>
<h3 class="gold" id="rule"></h3><p id="explain"></p>
<div class="sample"><div class="en" id="example" lang="en"></div><div class="ar" id="translation"></div></div>
<div class="tip" id="tip"></div>
<div class="actions"><button class="primary" id="speak">🔊 استمع</button><button class="secondary" id="slow">🐢 ببطء</button></div>
<div class="actions"><button class="secondary" id="prev">السابق</button><button class="primary" id="next">الدرس التالي</button></div>
</section>
<section class="panel"><h3 class="gold">اختبر فهمك</h3><p class="muted" id="question"></p><div class="options" id="choices"></div><div class="notice hidden" id="feedback" aria-live="polite"></div></section>
<p class="muted"><a href="build-sentences.html">تكوين الجمل</a> · <a href="daily-conversations.html">محادثات الحياة اليومية</a></p>
<p class="notice">الصوت آلي من المتصفح وقد يختلف حسب الجهاز. تقدمك يُحفظ محلياً على هذا الجهاز والمتصفح.</p>
</main>
<script>
const lessons=[
{title:"الدرس 1: الضمائر",rule:"I = أنا · You = أنت · He = هو · She = هي",explain:"الضمير كلمة نستخدمها بدلاً من الاسم. نستخدم I للحديث عن أنفسنا، وYou لمخاطبة شخص، وHe للذكر، وShe للأنثى.",example:"She is Sara.",translation:"هي سارة.",tip:"تذكّر: He للولد أو الرجل، وShe للبنت أو المرأة.",q:"أي ضمير نستخدم عند الحديث عن بنت؟",opts:["He","She","I"],a:1},
{title:"الدرس 2: am / is / are",rule:"I am · He/She is · You/We/They are",explain:"هذه كلمات ربط بسيطة. نقول I am مع I، وis مع he أو she، وare مع you أو we أو they.",example:"I am happy.",translation:"أنا سعيد.",tip:"احفظها هكذا: I am، ثم He is، ثم You are.",q:"اختر الكلمة الصحيحة: He ___ happy.",opts:["am","are","is"],a:2},
{title:"الدرس 3: a / an",rule:"a قبل صوت ساكن · an قبل صوت متحرك",explain:"نستخدم a أو an قبل اسم مفرد غير محدد. الاختيار يعتمد على الصوت الأول للكلمة، لا على الحرف المكتوب فقط.",example:"An apple. / A book.",translation:"تفاحة. / كتاب.",tip:"apple تبدأ بصوت متحرك فنقول an apple. book تبدأ بصوت ساكن فنقول a book.",q:"اختر الصحيح: ___ apple",opts:["A","An","Are"],a:1},
{title:"الدرس 4: المفرد والجمع",rule:"غالباً نضيف s إلى الاسم",explain:"عندما نتحدث عن شيء واحد نقول book، وعندما نتحدث عن أكثر من كتاب نقول books. توجد كلمات لها جموع خاصة، سنتعلمها لاحقاً.",example:"One book. Two books.",translation:"كتاب واحد. كتابان.",tip:"غالباً نضيف s عند تحويل الاسم من مفرد إلى جمع.",q:"ما جمع كلمة cat؟",opts:["cats","cates","cat"],a:0},
{title:"الدرس 5: المضارع البسيط",rule:"I / You / We / They + الفعل",explain:"نستخدم المضارع البسيط للعادة أو الشيء الذي يحدث بانتظام. مع he وshe نضيف غالباً s إلى الفعل في الجملة المثبتة.",example:"I play. / She plays.",translation:"أنا ألعب. / هي تلعب.",tip:"لاحظ الفرق: I play لكن She plays.",q:"اختر الجملة الصحيحة: هي تحب التفاح.",opts:["She like apples.","She likes apples.","She liking apples."],a:1}
];
let index=0,done=[];
const $=id=>document.getElementById(id);
try{const s=JSON.parse(localStorage.getItem("smartEdu365Grammar")||"{}");if(Number.isInteger(s.index)&&s.index>=0&&s.index<lessons.length)index=s.index;if(Array.isArray(s.done))done=s.done.filter(n=>Number.isInteger(n)&&n>=0&&n<lessons.length)}catch(e){}
function save(){try{localStorage.setItem("smartEdu365Grammar",JSON.stringify({index,done}))}catch(e){}}
function render(){const l=lessons[index];$("lessonTitle").textContent=l.title;$("counter").textContent=(index+1)+" / "+lessons.length;$("bar").style.width=((index+1)/lessons.length*100)+"%";$("rule").textContent=l.rule;$("explain").textContent=l.explain;$("example").textContent=l.example;$("translation").textContent=l.translation;$("tip").textContent=l.tip;$("question").textContent=l.q;$("choices").innerHTML=l.opts.map((x,i)=>'<button data-i="'+i+'">'+x+'</button>').join("");$("feedback").classList.add("hidden");$("prev").disabled=index===0;$("next").textContent=index===lessons.length-1?"ابدأ من جديد":"الدرس التالي";$("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.i)===l.a;if(ok&&!done.includes(index))done.push(index);$("feedback").textContent=ok?"أحسنت! إجابة صحيحة ⭐":"حاول مرة أخرى. اقرأ الشرح والمثال ثم اختر."; $("feedback").classList.remove("hidden");save()});save()}
function speak(rate){if(!("speechSynthesis"in window)){alert("النطق الصوتي غير متاح في هذا المتصفح.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lessons[index].example);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u)}
$("speak").onclick=()=>speak(.8);$("slow").onclick=()=>speak(.52);$("prev").onclick=()=>{index=Math.max(0,index-1);render()};$("next").onclick=()=>{index=index===lessons.length-1?0:index+1;render()};render();
</script><script>/* SMART EDU 360 English speech reliability */(()=>{const s=window.speechSynthesis;if(!s||s.__smartEdu360Patched)return;const native=s.speak.bind(s);function voice(u){if(!(u.lang||"en-US").toLowerCase().startsWith("en"))return;if(u.voice&&u.voice.lang&&u.voice.lang.toLowerCase().startsWith("en"))return;const vs=s.getVoices()||[];const v=vs.find(x=>/^en-us$/i.test(x.lang))||vs.find(x=>/^en-gb$/i.test(x.lang))||vs.find(x=>/^en-/i.test(x.lang))||vs.find(x=>/^en$/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang}}function split(t){const ss=(t.match(/[^.!?]+[.!?]?/g)||[t]).map(x=>x.trim()).filter(Boolean),out=[];for(const a of ss){if(a.length<=115){out.push(a);continue}let p="";for(const w of a.split(/\s+/)){if(p&&(p+" "+w).length>105){out.push(p);p=w}else p=p?p+" "+w:w}if(p)out.push(p)}return out.length?out:[t]}s.speak=function(u){if(!u||typeof u.text!=="string"||!(u.lang||"en-US").toLowerCase().startsWith("en"))return native(u);voice(u);const parts=split(u.text.trim());if(parts.length<2)return native(u);let i=0;const go=()=>{const q=new SpeechSynthesisUtterance(parts[i]);q.lang=u.lang||"en-US";q.rate=u.rate;q.pitch=u.pitch;q.volume=u.volume;if(u.voice)q.voice=u.voice;if(i===0&&u.onstart)q.onstart=e=>u.onstart(e);q.onend=e=>{if(++i<parts.length)go();else if(u.onend)u.onend(e)};q.onerror=e=>{if(u.onerror)u.onerror(e)};native(q)};go()};s.__smartEdu360Patched=true})();</script></body></html>
