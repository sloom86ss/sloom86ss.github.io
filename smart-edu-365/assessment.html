<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>الاختبار النهائي | دورة الاحترام | ثَقِّف طفلك – SMART EDU 360</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#101014;color:#f8f2e5;font:16px/1.9 Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#1b1a20;border:1px solid #6d542b;border-radius:20px;padding:clamp(16px,4vw,26px);margin:16px 0;box-shadow:0 15px 38px #0005}.gold{color:#f0cf83}.muted{color:#c8c0b2;font-size:14px}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{height:10px;border-radius:99px;background:#38343d;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#b58b43,#f0cf83);transition:width .35s ease}.counter{color:#f0cf83;font-weight:bold;font-size:13px}.question{min-height:95px;font-size:clamp(19px,4vw,25px);font-weight:800;display:flex;align-items:center}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:flex;gap:12px;align-items:center;text-align:right;width:100%;padding:14px;border:1px solid #514958;border-radius:14px;background:#121218;color:#fff;font:700 16px/1.7 Tahoma,Arial,sans-serif;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.choice:active{transform:scale(.99)}.choice.selected{border-color:#f0cf83;background:#3b3020;box-shadow:0 0 0 2px #f0cf8330}.choice:focus-visible,button:focus-visible{outline:3px solid #ffe6a2;outline-offset:3px}.choice .letter{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#39313f;color:#f0cf83}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between}.actions button{border:0;border-radius:11px;padding:12px 18px;background:#e8c16f;color:#211707;font:700 15px Tahoma,Arial,sans-serif;cursor:pointer}.actions button.secondary{background:#302a35;color:#fff;border:1px solid #62576a}.actions button:disabled{opacity:.4;cursor:not-allowed}.feedback{margin:12px 0;padding:12px;border-radius:12px;background:#242019;color:#f8e7bb}.hidden{display:none!important}.result{text-align:center;padding:20px}.score{font-size:34px;color:#f0cf83;font-weight:900}.result a{color:#f0cf83}.tiny{font-size:12px;color:#bfb5a7}@media(max-width:480px){body{padding:12px}.choice{font-size:15px;padding:12px}.actions button{flex:1}.question{min-height:110px}}
</style></head><body><main class="wrap">
<h1 class="gold">ثَقِّف طفلك – SMART EDU 360</h1><h2>الاختبار النهائي: الاحترام وحُسن التعامل</h2>
<p class="muted">أجب بهدوء عن خمسة أسئلة، سؤالاً واحداً في كل مرة. اختر إجابة ثم اضغط «التالي».</p>
<section class="panel" id="quizPanel">
<div class="quiz-top"><b class="gold">رحلة التحدّي ⭐</b><span class="counter" id="counter">السؤال 1 من 5</span></div>
<div class="progress" role="progressbar" aria-label="تقدم الاختبار" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress"><span id="progressFill"></span></div>
<div class="question" id="question" aria-live="polite"></div>
<div class="choices" id="choices"></div>
<div class="feedback hidden" id="feedback" aria-live="polite"></div>
<div class="actions"><button type="button" class="secondary" id="readQuestion">🔊 استمع للسؤال</button><button type="button" class="secondary" id="back" disabled>السابق</button><button type="button" id="next" disabled>التالي ←</button></div>
<p class="tiny">يمكنك الرجوع للسؤال السابق وتغيير إجابتك قبل إنهاء الاختبار.</p>
</section>
<section class="panel result hidden" id="result" aria-live="polite"></section>
<p class="muted"><a href="manners-course.html" style="color:#f0cf83">مراحل الدورة</a> · <a href="certificates.html" style="color:#f0cf83">الشهادة</a></p>
<footer class="tiny" style="text-align:center;padding:14px">تم تطويره بواسطة SLOOMAI</footer>
</main>
<script src="voice.js"></script>
<script>
const questions=[
{q:'إذا دخلت الصف صباحاً، فما التصرف المهذب؟',a:['أدخل دون تحية','ألقي السلام وأرد التحية','أرفع صوتي على زملائي'],c:1},
{q:'إذا أردت استخدام غرض يخص صديقك، فماذا تفعل؟',a:['أستأذن أولاً','آخذه دون علمه','أخفيه'],c:0},
{q:'إذا أخطأت في حق شخص، فما التصرف الصحيح؟',a:['ألومه','أتجاهله','أعتذر وأحاول إصلاح الخطأ'],c:2},
{q:'إذا اختلفت مع صديقك، فكيف تتصرف؟',a:['أسخر منه','أتحاور بهدوء وأبحث عن حل عادل','أؤذيه'],c:1},
{q:'إذا شاهدت تنمّراً على زميل، فماذا تفعل؟',a:['أشارك في السخرية','أصمت دائماً','لا أشارك وأخبر شخصاً بالغاً موثوقاً'],c:2}
];
let current=0;const answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id);
function render(){
 const q=questions[current];$('counter').textContent='السؤال '+(current+1)+' من '+questions.length;
 $('progressFill').style.width=(current/questions.length*100)+'%';$('progress').setAttribute('aria-valuenow',String(current));
 $('question').textContent=q.q;$('choices').innerHTML='';
 q.a.forEach((label,index)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(answers[current]===index?' selected':'');b.setAttribute('aria-pressed',String(answers[current]===index));const letter=document.createElement('span');letter.className='letter';letter.textContent=['أ','ب','ج'][index];const text=document.createElement('span');text.textContent=label;b.append(letter,text);b.addEventListener('click',()=>{answers[current]=index;renderChoices();$('next').disabled=false;});$('choices').appendChild(b);});
 $('back').disabled=current===0;$('next').disabled=answers[current]===null;$('next').textContent=current===questions.length-1?'إنهاء الاختبار':'التالي ←';$('feedback').classList.add('hidden');
}
function renderChoices(){[...$('choices').children].forEach((b,i)=>{const yes=answers[current]===i;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',String(yes));});}
function readQuestion(){const q=questions[current];const text=q.q+' الخيارات: '+q.a.map((a,i)=>(['أ','ب','ج'][i]+'. '+a)).join('. ');if(window.SmartEduVoice)window.SmartEduVoice.speak(text,.86);}
$('readQuestion').onclick=readQuestion;
$('back').onclick=()=>{if(current>0){current--;render();}};
$('next').onclick=()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render();}else finish();};
function finish(){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.c?1:0),0),passed=score>=4;
 sessionStorage.setItem('smartEdu365Assessment',JSON.stringify({track:'manners',score,total:5,passed,level:'manners',at:Date.now()}));
 $('quizPanel').classList.add('hidden');$('result').classList.remove('hidden');
 $('result').innerHTML='<h2 class="gold">'+(passed?'أحسنت! اجتزت الاختبار النهائي ⭐':'محاولة جميلة! واصل التعلّم 🌱')+'</h2><div class="score">'+score+' / 5</div><p>نتيجتك '+(score*20)+'٪.</p><p>'+(passed?'رائع! لقد أتقنت أساسيات الاحترام وحُسن التعامل.':'تحتاج إلى أربع إجابات صحيحة للنجاح. راجع الدروس ثم حاول مرة أخرى.')+'</p>'+(passed?'<a href="certificates.html">انتقل إلى الشهادة التحفيزية</a>':'<button type="button" id="retry">إعادة الاختبار</button>');if(!passed)$('retry').onclick=()=>{current=0;answers.fill(null);$('result').classList.add('hidden');$('quizPanel').classList.remove('hidden');render();};
 if(window.SmartEduVoice)window.SmartEduVoice.speak('انتهى الاختبار. نتيجتك '+score+' من خمسة. '+(passed?'أحسنت، لقد نجحت!':'حاول مرة أخرى، أنت تستطيع.'),.88);
}
render();
</script></body></html>
